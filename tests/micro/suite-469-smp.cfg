; SMP-13 (#469): two vCPUs of the SAME VM alternate on ONE shared core.
;
;   SMP=2 tools/micro/run-micro.sh --suite tests/micro/suite-469-smp.cfg
;
; vCPU 0 brings vCPU 1 up by INIT/SIPI; both write and verify their own half of RAM with their
; own seed while the core switches between them. The INIT/SIPI handshake itself crosses the
; switch: vCPU 0 waits for vCPU 1 to park, and vCPU 1 can only park when vCPU 0 yields.
[hype]
config_version = 1
log_level = debug
shared_timeslice_us = 2000

[vm.smp]
label = micro/sharemem-smp
vcpus = 2
cpu_mode = shared
mem_mb = 192
boot = kernel
kernel = \EFI\hype\micro\sharemem.bin
cmdline = seed=0x5eed5eed00000003 rounds=40 smp=1
os_hint = none
