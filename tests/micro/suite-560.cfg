; #560: a dedicated VM gets its cores' THREADS as vCPUs, not one core per vCPU.
;
; Run this against a host topology with real SMT siblings:
;
;   SMP=cpus=8,cores=4,threads=2 tools/micro/run-micro.sh --suite tests/micro/suite-560.cfg
;
; Four cores, the BSP's reserved, so three 2-thread cores are offered to guests. 2+2+1 vCPUs is
; five vCPUs but only THREE cores, so all three VMs must run. Under the pre-#560 pricing (one
; whole core per vCPU) the same config admitted only the first two VMs, and #559's cap said so
; out loud -- so a run where vm2 is missing is this ticket regressing, not a flaky guest.
;
; The evidence to read in the log is the per-VM placement line, not just the verdicts:
;   fw-1 SMP: vm0 placed 2 vCPU(s) on 1 whole physical core(s), 2 thread(s)/core
;   fw-1 SMP: vm1 placed 2 vCPU(s) on 1 whole physical core(s), 2 thread(s)/core
;   fw-1 SMP: vm2 placed 1 vCPU(s) on 1 whole physical core(s), 1 thread(s)/core
; vm2's "1 thread/core" is deliberate: it owns a 2-thread core but has no vCPU on the sibling,
; so advertising 2 would describe a CPU the guest does not have.
;
; QEMU defaults to one thread per core, which is why this needs the explicit SMP= above: with
; `-smp 8` hype sees eight single-threaded cores and the SMT path is never exercised at all.
[hype]
config_version = 1
log_level = debug

[vm.hello]
label = micro/hello
vcpus = 2
mem_mb = 512
boot = kernel
kernel = \EFI\hype\micro\hello.bin
os_hint = none

[vm.ram1]
label = micro/ram1
vcpus = 2
mem_mb = 512
boot = kernel
kernel = \EFI\hype\micro\ram1.bin
os_hint = none

[vm.cpumsr]
label = micro/cpumsr
vcpus = 1
mem_mb = 512
boot = kernel
kernel = \EFI\hype\micro\cpumsr.bin
os_hint = none
