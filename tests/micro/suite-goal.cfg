; THE GOAL, as one config: two guests that each ping www.google.com and each other.
;
; Every part of hype's networking is in the path at once, and the four steps fail differently:
;
;   ARP        hype answers the guest's ARP and learns its address (proxy ARP -- hype is told
;              nothing about 192.168.77.0/24; the guests only have to agree with each other)
;   DNS        NAPT rewriting a UDP source port and fixing the checksum, both directions
;   ping WAN   NAPT rewriting an ICMP echo IDENTIFIER -- a different field, a different protocol, and
;              a checksum that does not cover the IP header, so the DNS step proves nothing about it
;   ping peer  hype forwarding between two isolated segments after checking the pair is allowed
;
; `uplink_*` is QEMU user-mode networking's fixed layout: slirp hands out .15 first and is itself the
; gateway at .2. hype takes its address from config rather than assuming that, which is why these
; lines exist at all.
;
; NOTE ON THE ICMP-TO-THE-INTERNET STEP: QEMU forwards ICMP only if the host permits unprivileged
; ICMP sockets (net.ipv4.ping_group_range). On a host that forbids it, this config fails at the ping
; step with the DNS step passing -- and that signature is the environment, not hype. The test says so
; in its own failure message.
[hype]
config_version = 1
log_level = debug
uplink_ip = 10.0.2.15
uplink_mask = 255.255.255.0
uplink_gateway = 10.0.2.2

[vm.one]
label = goal/vm-one
vcpus = 1
mem_mb = 512
boot = kernel
kernel = \EFI\hype\micro\netgoal.bin
cmdline = self=2 peer=3
os_hint = none
net_mode = nat
net_peers = two

[vm.two]
label = goal/vm-two
vcpus = 1
mem_mb = 512
boot = kernel
kernel = \EFI\hype\micro\netgoal.bin
cmdline = self=3 peer=2
os_hint = none
net_mode = nat
