; SMP-13 (#469): two VMs from DIFFERENT trust groups alternate on ONE shared core.
;
;   SMP=2 tools/micro/run-micro.sh --suite tests/micro/suite-469.cfg
;
; -smp 2: the BSP keeps core 0, so the shared pool is one core and both VMs land on it. Each
; guest writes its own seed's pattern over all of its RAM every round and verifies it; a missed
; NPT/EPT root or ASID/VPID swap shows as the other guest's seed.
[hype]
config_version = 1
log_level = debug
shared_timeslice_us = 2000

[vm.sa]
label = micro/sharemem-a
vcpus = 1
cpu_mode = shared
mem_mb = 128
boot = kernel
kernel = \EFI\hype\micro\sharemem.bin
cmdline = seed=0xa11ce5eed0000001 rounds=40
os_hint = none

[vm.sb]
label = micro/sharemem-b
vcpus = 1
cpu_mode = shared
mem_mb = 160
boot = kernel
kernel = \EFI\hype\micro\sharemem.bin
cmdline = seed=0xb0b5eed000000002 rounds=40
os_hint = none
