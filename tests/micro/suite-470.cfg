; SMP-14 (#470): mandatory preemption. Two hogs and a worker share ONE core.
;
;   SMP=2 tools/micro/run-micro.sh --suite tests/micro/suite-470.cfg
;
; hogcli spins in `cli; jmp .` and hogpause in `cli; pause; jmp .` -- neither ever gives the core
; up. The worker (sharemem) must still finish all of its rounds, and hype's SCHED lines must show
; each hog preempted every slice with a bounded overrun. Reused by SMP-20 (#476).
[hype]
config_version = 1
log_level = debug
shared_timeslice_us = 2000

[vm.hogcli]
label = micro/cpuhog-cli
vcpus = 1
cpu_mode = shared
mem_mb = 64
boot = kernel
kernel = \EFI\hype\micro\cpuhog.bin
cmdline = mode=cli
os_hint = none

[vm.work]
label = micro/sharemem-worker
vcpus = 1
cpu_mode = shared
mem_mb = 128
boot = kernel
kernel = \EFI\hype\micro\sharemem.bin
cmdline = seed=0x0dd0bee500000004 rounds=20
os_hint = none

[vm.hogpause]
label = micro/cpuhog-pause
vcpus = 1
cpu_mode = shared
mem_mb = 64
boot = kernel
kernel = \EFI\hype\micro\cpuhog.bin
cmdline = mode=pause
os_hint = none
