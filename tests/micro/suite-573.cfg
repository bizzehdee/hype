; #573: the ONE config that was never tried -- `display = bochs` together with two or more disks.
;
; The Bochs VBE adapter used to be device 6, and fw_1_slot_pci_dev() hands disk slot 1 device 6 as
; well, so this config put two different devices at 00:06.0 and hype_pci_add_device() silently
; overwrote whichever ran first. The guest saw one device that was never presented -- either the
; operator's display adapter or their second disk, depending on ordering, with nothing logged.
;
; The bochsvbe guest proves the VBE side: it finds the adapter and owns its register window. hype's
; own log lines prove the disk side (slot 1 presented) and that no slot was refused.
[hype]
config_version = 1
log_level = debug

[vm.bochsvbe]
label = micro/573-bochs-plus-two-disks
vcpus = 1
mem_mb = 512
boot = kernel
kernel = \EFI\hype\micro\bochsvbe.bin
os_hint = none
display = bochs
disks = d0, d1

[disk.d0]
type = disk
backing = file
path = \hype\disks\d573a.img
bus = virtio-blk

[disk.d1]
type = disk
backing = file
path = \hype\disks\d573b.img
bus = ahci-sata
