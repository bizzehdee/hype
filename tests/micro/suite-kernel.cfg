; #554: ONE VM running the suite kernel, which runs the tests in turn.
;
; This is what makes a bare-metal sweep possible: a 4-core host runs at most 3 VMs, so a stick with
; two Alpine guests has exactly one left. tests= names the members; omit it to run all of them.
[hype]
config_version = 1
log_level = debug

[vm.suite]
label = micro/suite
vcpus = 1
mem_mb = 512
boot = kernel
kernel = \EFI\hype\micro\suite.bin
cmdline = tests=hello,ram1,cpumsr,fwcfg,pci,pflash,intdeliver,pausespin,nosuchtest
os_hint = none
