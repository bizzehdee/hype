; #536: the whole ported microtest suite, one VM per test.
;
; A run is `tools/micro/run-micro.sh --suite tests/micro/suite-all.cfg`, and "run only test N" is an
; edit to this file. That replaces `-DHYPE_SELFTEST_LIMIT=N` plus a rebuild -- which is the #237
; bisect knob this epic exists to retire: bisecting a battery that lives inside the hypervisor means
; rebuilding the hypervisor to change what the tests do.
;
; Every VM here is deliberately given its own core and its own RAM, because that is what a
; configured VM is. Admission will cap the count on a small host and SAY which tests did not run
; (#396) -- a suite that quietly ran a subset would be worse than one that refuses.
;
; faulter is NOT in this list. It exists to fail (#538), so including it would make a healthy run
; look broken; tests/micro/suite-538.cfg is where it belongs.
[hype]
config_version = 1
log_level = debug

[vm.ram1]
label = micro/ram1
vcpus = 1
mem_mb = 512
boot = kernel
kernel = \EFI\hype\micro\ram1.bin
os_hint = none

[vm.hello]
label = micro/hello
vcpus = 1
mem_mb = 512
boot = kernel
kernel = \EFI\hype\micro\hello.bin
os_hint = none
