; #546: the three command-line states, one VM each, in one boot.
;
; They must be distinguishable in the log, because they are different configs and the loader turns
; them into different things: cmd_line_ptr = 0, a pointer to a NUL, and a pointer to a string.
; A run that reported the same thing for all three would mean the key does nothing.
[hype]
config_version = 1
log_level = debug

[vm.set]
label = micro/cmdline-set
vcpus = 1
mem_mb = 512
boot = kernel
kernel = \EFI\hype\micro\hello.bin
cmdline = console=ttyS0 pages=all verify=strict
os_hint = none

[vm.empty]
label = micro/cmdline-empty
vcpus = 1
mem_mb = 512
boot = kernel
kernel = \EFI\hype\micro\hello.bin
cmdline =
os_hint = none

[vm.none]
label = micro/cmdline-none
vcpus = 1
mem_mb = 512
boot = kernel
kernel = \EFI\hype\micro\hello.bin
os_hint = none
