; NET-4a/4b (#84/#85): two guests that are allowed to reach each other, and prove it with ICMP.
;
; THE `net_peers` LINE IS THE SUBJECT OF THE TEST. Remove it and both guests should still boot, both
; should still get their ARP answered, and every echo request should be DROPPED -- that is #84's
; default-deny, and `fw-1 PEER vm0: ... DENIED=n` is where it shows. A run of this config with the
; line commented out is the negative case; see tests/micro/suite-peers-denied.cfg.
;
; Listed on one side only, deliberately: plan.md §6e says listing a peer on either side establishes
; it bidirectionally, so a config that named it twice would not be testing that rule.
;
; No [hype] uplink keys. Guest-to-guest traffic never touches the physical network -- hype forwards
; the frame itself -- so this must work on a host with no uplink at all, and leaving them out is what
; proves it does.
[hype]
config_version = 1
log_level = debug

[vm.a]
label = micro/netpeer-a
vcpus = 1
mem_mb = 512
boot = kernel
kernel = \EFI\hype\micro\netpeer.bin
cmdline = self=2 peer=3
os_hint = none
net_mode = nat
net_peers = b

[vm.b]
label = micro/netpeer-b
vcpus = 1
mem_mb = 512
boot = kernel
kernel = \EFI\hype\micro\netpeer.bin
cmdline = self=3 peer=2
os_hint = none
net_mode = nat
