; SMP-21 (#477): three always-runnable tenants on ONE core, so the scheduler's own figures have an
; exact expected value: 500 switches/s at a 2000 us slice, and steal = 2 x run for each tenant.
;
;   SMP=2 tools/micro/run-micro.sh --suite tests/micro/suite-477.cfg
[hype]
config_version = 1
log_level = debug
shared_timeslice_us = 2000

[vm.hogcli]
label = micro/cpuhog-cli
vcpus = 1
cpu_mode = shared
mem_mb = 64
boot = kernel
kernel = \EFI\hype\micro\cpuhog.bin
cmdline = mode=cli
os_hint = none

[vm.hogpause]
label = micro/cpuhog-pause
vcpus = 1
cpu_mode = shared
mem_mb = 64
boot = kernel
kernel = \EFI\hype\micro\cpuhog.bin
cmdline = mode=pause
os_hint = none

[vm.hogsti]
label = micro/cpuhog-sti
vcpus = 1
cpu_mode = shared
mem_mb = 64
boot = kernel
kernel = \EFI\hype\micro\cpuhog.bin
cmdline = mode=sti
os_hint = none
