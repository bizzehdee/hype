; #603: systematic VM-exit coverage. Three VMs, in the order hype dispatches config sections:
;
;   vmexit       walks every non-fatal exit reason (HLT, CPUID, RDMSR/WRMSR, IN/OUT incl. string
;                forms, unmodelled-MMIO absorb, the SVM-privileged-instruction #UD group, plain
;                INVLPG, MONITOR/MWAIT, INIT/SIPI) and finishes with a deliberate triple fault --
;                see tests/micro/vmexit.c's own header for the full exit-reason -> probe -> EXHIST
;                coverage table. vcpus = 2 because the INIT/SIPI probe needs a second vCPU to wake.
;   vmexitstorm  #603 item 4: deliberately trips hype's #171 per-vCPU watchdog (plan.md Sec 6g,
;                #538) so hype force-powers THIS VM off alone -- see tests/micro/vmexitstorm.c.
;   hello        the healthy control. Like suite-538.cfg's own pairing, a run only demonstrates
;                Sec 6g isolation if hello's PASS still shows up after BOTH of the VMs above end
;                themselves by different mechanisms (a triple fault and a watchdog force-off).
;
; vmexit and vmexitstorm are both deliberately excluded from the default `tools/micro/run-micro.sh`
; sweep (see MICRO_EXCLUDE_DEFAULT there) for the same reason faulter is: each ends its own VM on
; purpose, which would make a healthy run look broken. This config is how they are actually run.
[hype]
config_version = 1
log_level = debug

[vm.vmexit]
label = micro/vmexit
vcpus = 2
mem_mb = 512
boot = kernel
kernel = \EFI\hype\micro\vmexit.bin
os_hint = none

[vm.vmexitstorm]
label = micro/vmexitstorm
vcpus = 1
mem_mb = 512
boot = kernel
kernel = \EFI\hype\micro\vmexitstorm.bin
os_hint = none

[vm.hello]
label = micro/hello
vcpus = 1
mem_mb = 512
boot = kernel
kernel = \EFI\hype\micro\hello.bin
os_hint = none
