; #535: one kernel-boot VM, nothing else.
;
; No target_disk and no firmware key: a boot = kernel VM has nothing to boot from a disk and no
; firmware in its path, so those are waived for this mode (docs/hype-cfg-spec.md §5.4b). If they
; were required, every microtest config would carry two lines that do nothing.
[hype]
config_version = 1
log_level = debug

[vm.hello]
label = micro/hello
vcpus = 1
mem_mb = 512
boot = kernel
kernel = \EFI\hype\micro\hello.bin
os_hint = none
