; SMP-19 (#475): NUMA placement on a two-node QEMU host.
;
;   tools/475/run-475.sh
;
; Two sockets x two cores, one node per socket. The BSP keeps core 0 (node 0); vm0 packs onto
; core 1 (node 0) and vm1 onto core 2 (node 1). vm1's RAM must come from node 1's pool, and both
; guests must read back every page of it.
[hype]
config_version = 1
log_level = debug

[vm.n0]
label = micro/sharemem-node0
vcpus = 1
mem_mb = 256
boot = kernel
kernel = \EFI\hype\micro\sharemem.bin
cmdline = seed=0x0000475000000010 rounds=5
os_hint = none

[vm.n1]
label = micro/sharemem-node1
vcpus = 1
mem_mb = 256
boot = kernel
kernel = \EFI\hype\micro\sharemem.bin
cmdline = seed=0x1111475000000011 rounds=5
os_hint = none
