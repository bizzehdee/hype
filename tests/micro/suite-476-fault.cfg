; SMP-20 (#476) proof 3: a faulted guest is torn down alone on a shared core.
;
;   SMP=2 tools/micro/run-micro.sh --suite tests/micro/suite-476-fault.cfg
;
; One pool core: the faulter triple-faults on purpose and its VM stops; the worker and the hog on
; the SAME core must carry on -- the worker finishing its rounds is the proof. A stopped VM that
; kept the core would starve both.
[hype]
config_version = 1
log_level = debug
shared_timeslice_us = 2000

[vm.fault]
label = micro/faulter
vcpus = 1
cpu_mode = shared
mem_mb = 64
boot = kernel
kernel = \EFI\hype\micro\faulter.bin
cmdline = x=1
os_hint = none

[vm.work]
label = micro/sharemem-worker
vcpus = 1
cpu_mode = shared
mem_mb = 128
boot = kernel
kernel = \EFI\hype\micro\sharemem.bin
cmdline = seed=0x4764764700000007 rounds=15
os_hint = none

[vm.hog]
label = micro/cpuhog-cli
vcpus = 1
cpu_mode = shared
mem_mb = 64
boot = kernel
kernel = \EFI\hype\micro\cpuhog.bin
cmdline = mode=cli
os_hint = none
