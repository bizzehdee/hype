; #539: CPUMSR, twice -- once without the Hyper-V leaves and once with them.
;
; os_hint is what turns the Hyper-V leaves on (boot/main.c: hv_leaves = os_hint == windows), so the
; SAME artifact covers both cases, selected by config. That is the epic's argument in one file: the
; in-binary version could only ever see whatever its own launch code enabled.
;
; hv=require on the second VM makes the Hyper-V arm mandatory rather than skipped, so a config that
; should have enabled the leaves and did not FAILS instead of quietly testing less.
[hype]
config_version = 1
log_level = debug

[vm.cpumsr]
label = micro/cpumsr
vcpus = 1
mem_mb = 512
boot = kernel
kernel = \EFI\hype\micro\cpumsr.bin
os_hint = none

[vm.cpumsrhv]
label = micro/cpumsr-hv
vcpus = 1
mem_mb = 512
boot = kernel
kernel = \EFI\hype\micro\cpumsr.bin
cmdline = hv=require
os_hint = windows
