; SMP-20 (#476) proof 4: memory isolation across switches, under adversarial scheduling.
;
;   SMP=2 tools/micro/run-micro.sh --suite tests/micro/suite-476-mem.cfg
;
; Two sharemem guests of different trust groups and two hogs on ONE core: every switch between
; the two memory guests passes through a hog, and each group change forces the #474 flush.
[hype]
config_version = 1
log_level = debug
shared_timeslice_us = 2000

[vm.ma]
label = micro/sharemem-a
vcpus = 1
cpu_mode = shared
mem_mb = 96
boot = kernel
kernel = \EFI\hype\micro\sharemem.bin
cmdline = seed=0xaaaa476600000008 rounds=20
os_hint = none

[vm.hog1]
label = micro/cpuhog-cli
vcpus = 1
cpu_mode = shared
mem_mb = 64
boot = kernel
kernel = \EFI\hype\micro\cpuhog.bin
cmdline = mode=cli
os_hint = none

[vm.mb]
label = micro/sharemem-b
vcpus = 1
cpu_mode = shared
mem_mb = 112
boot = kernel
kernel = \EFI\hype\micro\sharemem.bin
cmdline = seed=0xbbbb476600000009 rounds=20
os_hint = none

[vm.hog2]
label = micro/cpuhog-rep
vcpus = 1
cpu_mode = shared
mem_mb = 64
boot = kernel
kernel = \EFI\hype\micro\cpuhog.bin
cmdline = mode=rep
os_hint = none
