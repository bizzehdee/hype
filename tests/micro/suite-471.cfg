; SMP-15 (#471): interrupts for a descheduled vCPU are held and delivered on resume.
;
;   SMP=2 tools/micro/run-micro.sh --suite tests/micro/suite-471.cfg
;
; timekeep halts between 100 Hz PIT ticks on a core shared with a hog that never yields and a
; worker that never halts. It must count 100 ticks per RTC second (host time) within 1%.
[hype]
config_version = 1
log_level = debug
shared_timeslice_us = 2000

[vm.time]
label = micro/timekeep
vcpus = 1
cpu_mode = shared
mem_mb = 64
boot = kernel
kernel = \EFI\hype\micro\timekeep.bin
cmdline = secs=30
os_hint = none

[vm.hog]
label = micro/cpuhog-cli
vcpus = 1
cpu_mode = shared
mem_mb = 64
boot = kernel
kernel = \EFI\hype\micro\cpuhog.bin
cmdline = mode=cli
os_hint = none

[vm.work]
label = micro/sharemem-worker
vcpus = 1
cpu_mode = shared
mem_mb = 128
boot = kernel
kernel = \EFI\hype\micro\sharemem.bin
cmdline = seed=0x7171717100000005 rounds=30
os_hint = none
