; #538: one VM that kills itself, one that does not.
;
; The faulter is FIRST on purpose. hype dispatches VMs in config order, so if a guest fault took
; the host down, vm1 would never reach its own verdict -- which is exactly the failure this
; config exists to detect. A run passes only if BOTH lines appear: faulter's FAIL and hello's PASS.
[hype]
config_version = 1
log_level = debug

[vm.faulter]
label = micro/faulter
vcpus = 1
mem_mb = 512
boot = kernel
kernel = \EFI\hype\micro\faulter.bin
os_hint = none

[vm.hello]
label = micro/hello
vcpus = 1
mem_mb = 512
boot = kernel
kernel = \EFI\hype\micro\hello.bin
os_hint = none
