; #542: the PS/2 keyboard and mouse, driven from outside the guest.
;
; This VM NEEDS its input script (\input\vm0.txt). Without one the guest waits for bytes that never
; come, which is indistinguishable from a wedge -- the test says so in its own failure message, and
; the rig must ship the script with HYPE_INPUTS=.
[hype]
config_version = 1
log_level = debug

[vm.ps2]
label = micro/ps2
vcpus = 1
mem_mb = 512
boot = kernel
kernel = \EFI\hype\micro\ps2.bin
os_hint = none
