; SMP-20 (#476) proof 2: a guest cannot defer its own preemption.
;
;   SMP=3 tools/micro/run-micro.sh --suite tests/micro/suite-476-defer.cfg
;
; -smp 3: two pool cores, eight tenants (4.0 = the default ratio). Seven hogs, each trying a
; different way to keep its core -- masked spin, unmasked spin, PAUSE, back-to-back MOV SS
; shadows, a long rep movsb, cli;hlt, MONITOR/MWAIT -- and one worker that must still finish.
; hype's SCHED lines must show every tenant scheduled, with a bounded overrun and wait_max.
[hype]
config_version = 1
log_level = debug
shared_timeslice_us = 2000

[vm.work]
label = micro/sharemem-worker
vcpus = 1
cpu_mode = shared
mem_mb = 128
boot = kernel
kernel = \EFI\hype\micro\sharemem.bin
cmdline = seed=0x4764764700000006 rounds=15
os_hint = none

[vm.hogcli]
label = micro/cpuhog-cli
vcpus = 1
cpu_mode = shared
mem_mb = 64
boot = kernel
kernel = \EFI\hype\micro\cpuhog.bin
cmdline = mode=cli
os_hint = none

[vm.hogsti]
label = micro/cpuhog-sti
vcpus = 1
cpu_mode = shared
mem_mb = 64
boot = kernel
kernel = \EFI\hype\micro\cpuhog.bin
cmdline = mode=sti
os_hint = none

[vm.hogpause]
label = micro/cpuhog-pause
vcpus = 1
cpu_mode = shared
mem_mb = 64
boot = kernel
kernel = \EFI\hype\micro\cpuhog.bin
cmdline = mode=pause
os_hint = none

[vm.hogmovss]
label = micro/cpuhog-movss
vcpus = 1
cpu_mode = shared
mem_mb = 64
boot = kernel
kernel = \EFI\hype\micro\cpuhog.bin
cmdline = mode=movss
os_hint = none

[vm.hogrep]
label = micro/cpuhog-rep
vcpus = 1
cpu_mode = shared
mem_mb = 64
boot = kernel
kernel = \EFI\hype\micro\cpuhog.bin
cmdline = mode=rep
os_hint = none

[vm.hoghlt]
label = micro/cpuhog-hlt
vcpus = 1
cpu_mode = shared
mem_mb = 64
boot = kernel
kernel = \EFI\hype\micro\cpuhog.bin
cmdline = mode=hlt
os_hint = none

[vm.hogmwait]
label = micro/cpuhog-mwait
vcpus = 1
cpu_mode = shared
mem_mb = 64
boot = kernel
kernel = \EFI\hype\micro\cpuhog.bin
cmdline = mode=mwait
os_hint = none
