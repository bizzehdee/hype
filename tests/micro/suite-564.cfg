; #564: a vCPU IS a physical core, and SMT is a bonus.
;
; Run this against a host topology with real SMT siblings:
;
;   SMP=cpus=8,cores=4,threads=2 tools/micro/run-micro.sh --suite tests/micro/suite-560.cfg
;
; Four cores, the BSP's reserved, so three 2-thread cores are offered to guests. Three VMs at
; vcpus = 1 cost exactly three cores, and each guest gets TWO logical CPUs as an SMT bonus.
;
; The evidence to read in the log is the per-VM placement line, not just the verdicts:
;   fw-1 SMP: vm0 granted 1 whole physical core(s) -> 2 logical CPU(s), 2 thread(s)/core (SMT bonus)
;   fw-1 SMP: 3 whole physical core(s) granted -> 6 logical CPU(s) ... siblings known
;
; Run it a second time with SMP=8 (eight single-threaded cores): the cost is unchanged at three
; cores and each guest gets ONE logical CPU. A config priced in cores cannot stop fitting because
; SMT is absent, and that invariance is the property worth regression-testing.
;
; QEMU defaults to one thread per core, which is why this needs the explicit SMP= above: with
; `-smp 8` hype sees eight single-threaded cores and the SMT path is never exercised at all.
[hype]
config_version = 1
log_level = debug

[vm.hello]
label = micro/hello
vcpus = 1
mem_mb = 512
boot = kernel
kernel = \EFI\hype\micro\hello.bin
os_hint = none

[vm.ram1]
label = micro/ram1
vcpus = 1
mem_mb = 512
boot = kernel
kernel = \EFI\hype\micro\ram1.bin
os_hint = none

[vm.cpumsr]
label = micro/cpumsr
vcpus = 1
mem_mb = 512
boot = kernel
kernel = \EFI\hype\micro\cpumsr.bin
os_hint = none
