; #432 negative leg: Secure Boot firmware + an UNSIGNED installer ISO -- the guest firmware
; must refuse it.
[hype]
config_version = 1
log_level = debug

[vm.sb]
vcpus = 1
mem_mb = 1024
boot = installer
install_media = \iso\test.iso
firmware = uefi-secboot
os_hint = linux
net_mode = none
target_disk = file:\hype\disks\sb.img
