; #432 positive leg: Secure Boot firmware + a boot DISK whose \EFI\BOOT\BOOTX64.EFI is the
; Microsoft-signed shim -- the firmware must verify and EXECUTE it.
[hype]
config_version = 1
log_level = debug

[vm.sb]
vcpus = 1
mem_mb = 1024
boot = disk
firmware = uefi-secboot
os_hint = linux
net_mode = none
target_disk = file:\hype\disks\shimdisk.img
