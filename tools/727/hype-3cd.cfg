; #727: THREE optical drives on one VM -- the implicit install_media drive plus an
; explicit cdroms= entry. Before this ticket the second one was parsed,
; admission-checked and displayed, then never attached: the guest saw one
; /dev/sr0 and the addons disc simply did not exist.
;
; The input-script asserts BOTH discs from inside the guest, because the host
; log saying it presented a device is not the same claim as the guest being
; able to read it.
[hype]
config_version = 1
log_level = debug

[disk.addons]
type = cdrom
path = \iso\addons.iso

[disk.addons2]
type = cdrom
path = \iso\addons2.iso

; target_disk is sugar for ONE implicit [disk.*] and cannot coexist with an
; explicit disks=/cdroms= list -- core/cfg.c calls that contradiction a
; BAD_VALUE ("two answers to what disk"), not a precedence question. So the
; scratch disk needs its own entry, exactly as tools/232's own config already
; had to. Getting this wrong costs a whole QEMU run and is easy to misread:
; the parse fails with status=3 and hype falls back to its BUILT-IN default,
; which has no cdroms at all -- so the run looks like multi-cdrom failed when
; the config was never loaded.
[disk.scratch]
type = disk
backing = file
path = \hype\disks\scratch.img

[vm.twocd]
vcpus = 1
mem_mb = 1024
boot = installer
install_media = \iso\test.iso
firmware = uefi
os_hint = linux
cdroms = addons, addons2
disks = scratch
