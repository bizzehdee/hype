; #295 vectored-write leg: the guest's disk is a PHYSICAL AHCI target (QEMU's second
; SATA disk), inline target_disk form -- the only physical binding hype wires today
; (the [disk.*] backing=physical gap is its own ticket).
[hype]
config_version = 1

[vm.wtest]
label = 295 phys write workload
vcpus = 1
mem_mb = 1024
boot = installer
install_media = \iso\test.iso
firmware = uefi
os_hint = linux
net_mode = none
target_disk = physical:HYPE295SCRATCH
