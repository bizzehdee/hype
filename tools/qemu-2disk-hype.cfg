[hype]
config_version = 1

[vm.twodisk]
label = Two disk slots
vcpus = 1
mem_mb = 1024
boot = installer
install_media = \iso\test.iso
firmware = uefi
os_hint = linux
disks = a, b

[disk.a]
backing = file
path = \hype\disks\diska.img
bus = ahci-sata

[disk.b]
backing = file
path = \hype\disks\diskb.img
bus = nvme
