; #508 boot 1: one idle VM while the operator-typed mkdisk creates \disks\vm.qcow2 on the
; SECOND disk (serial HYPE508TGT, ext4), qcow2-sparse format.
[hype]
config_version = 1
log_level = debug

[vm.idle]
vcpus = 1
mem_mb = 512
boot = installer
install_media = \iso\test.iso
firmware = uefi
os_hint = linux
net_mode = none
target_disk = file:\hype\disks\idle.img
