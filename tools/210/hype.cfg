; #210 / #126: arm the REAL NVMe as a guest disk on the AMD laptop.
;
; The target is named by SERIAL, never by index. #124 matches this string against the drive hype
; actually discovers, #332 refuses rather than widening a mistyped partition scope, and #125 then
; requires the operator to re-type that serial at the dashboard before a single byte is written.
;
; Whole disk (no `partition =`) because the drive is blank -- mbrsig=0000, no GPT -- so there is no
; partition to scope to yet. Partition-scoped targeting is the next step once a table exists.
[hype]
config_version = 1

[vm.install]
label = 210 physical NVMe target
vcpus = 1
mem_mb = 2048
boot = installer
install_media = \iso\test.iso
firmware = uefi
os_hint = bsd
net_mode = none
target_disk = physical:5ME3N005713803V2W
