; #433: a Linux guest with a TPM 2.0 -- its tpm_crb driver must bind and expose /dev/tpm0.
[hype]
config_version = 1
log_level = debug

[vm.t]
vcpus = 1
mem_mb = 1024
boot = installer
install_media = \iso\test.iso
firmware = uefi
os_hint = linux
net_mode = none
tpm = on
target_disk = file:\hype\disks\t.img
