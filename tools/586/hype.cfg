; #586: a [disk.*] backing=physical entry (the device-section form) as the guest disk.
[hype]
config_version = 1
[vm.wtest]
label = 586 disk-section physical
vcpus = 1
mem_mb = 1024
boot = installer
install_media = \iso\test.iso
firmware = uefi
os_hint = linux
net_mode = none
disks = p
[disk.p]
backing = physical
id_match = HYPE295SCRATCH
partition = whole
bus = virtio-blk
allow_overwrite = true
