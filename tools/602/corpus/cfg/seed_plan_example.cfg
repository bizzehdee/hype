[vm.win11]
vcpus = 4
cpu_set = 4-7             ; explicit host core subset to pin to
mem_mb = 8192
boot = installer
install_media = \EFI\hype\win11.iso
target_disk = file:\hype\disks\win11.img
target_disk_size_gb = 128
firmware = uefi
os_hint = windows
net_mode = nat

[vm.debian]
vcpus = 2
mem_mb = 4096
boot = installer
install_media = \EFI\hype\debian-netinst.iso
target_disk = physical:SN-WDC-1234567890
firmware = uefi
os_hint = linux
net_mode = nat
net_peers = freebsd

[vm.freebsd]
vcpus = 2
mem_mb = 4096
boot = installer
install_media = \EFI\hype\FreeBSD.iso
target_disk = file:\hype\disks\freebsd.img
target_disk_size_gb = 64
firmware = uefi
os_hint = bsd
net_mode = nat
