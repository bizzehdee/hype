; #167: boot 1 -- FreeBSD's stock disc1 installer, driven through bsdinstall's own TUI by
; tools/167/input-vm0.txt, installing to a file-backed disk.
;
; os_hint = bsd, not the run-guest.sh generated config's `linux`: it is the hint a FreeBSD VM is
; meant to carry.
;
; net_mode = none keeps the rig NIC-less, so bsdinstall has no network screens to drive and the
; Distribution Sets path must be satisfied from the disc alone.
;
; The disk is an explicit [disk.g0] with bus = ahci-sata, in BOTH configs, so the guest sees the
; same device (ada0) at install time and at boot. Left to the defaults it does not: os_hint = bsd
; installs onto virtio-blk (vtbd0), but boot = disk forces ahci-sata (#333, because hype's guest
; firmware cannot boot from virtio-blk), and FreeBSD's fstab names the device -- so the installed
; system stops at "mountroot> " looking for /dev/vtbd0p2. Measured, first full run of this rig.
[hype]
config_version = 1

[disk.g0]
type = disk
backing = file
path = \hype\disks\g0.img
bus = ahci-sata

[vm.install]
vcpus = 2
mem_mb = 2048
boot = installer
install_media = \iso\test.iso
firmware = uefi
os_hint = bsd
net_mode = none
disks = g0
