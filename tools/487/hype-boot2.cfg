; #487 boot 2: attach the qcow2 mkdisk created on the second disk. hype's m5-8 resolver finds the
; file on ANY registered host disk (#324) and auto-detects qcow2 (M5-9).
[hype]
config_version = 1
log_level = debug

[vm.qtest]
vcpus = 1
mem_mb = 1024
boot = installer
install_media = \iso\test.iso
firmware = uefi
os_hint = linux
net_mode = none
target_disk = file:\disks\vm.qcow2
