; #732: two VMs, autostart names only the first. Before the fix both started;
; the key parsed and nothing read it.
[hype]
config_version = 1
log_level = debug
autostart = keep, nosuchvm

[vm.keep]
vcpus = 1
mem_mb = 1024
boot = installer
install_media = \iso\test.iso
firmware = uefi
os_hint = linux
net_mode = none
target_disk = file:\hype\disks\keep.img

[vm.held]
vcpus = 1
mem_mb = 1024
boot = installer
install_media = \iso\test.iso
firmware = uefi
os_hint = linux
net_mode = none
target_disk = file:\hype\disks\held.img
