; Run 1c (AMD 5950X) -- default build. #653 exFAT real-hardware pass, AMD half.
; Boots the SAME Alpine disk as 1a as the driver OS, with the exFAT scratch
; volume attached as a SECOND disk so the guest can mount and write to it.
;
; REPLACE <EXFAT-SCRATCH-SERIAL> with the real serial of the sanctioned
; scratch drive (docs/hw-val-211.md: AMD laptop's spare scratch NVMe is the
; only sanctioned write target there -- confirm the EQUIVALENT sanctioned
; scratch device on THIS 5950X box before filling this in; never a BitLocker
; or otherwise-in-use drive). Partition it exFAT ahead of time from a real OS.
; Input-script: \input\run1c.txt (input-scripts/exfat-write-test.txt).
[hype]
config_version = 1
log_level = debug

; target_disk (sugar) cannot coexist with an explicit disks= list (core/cfg.c
; treats it as a contradiction, correctly) -- the boot disk needs its own
; explicit entry here too, same fix #232's own validation work found.
[disk.bootdisk]
type = disk
backing = file
path = \hype\disks\alpine2vcpu.img
source_disk = 115E0735191800123920

[disk.exfatscratch]
type = disk
backing = physical
id_match = <EXFAT-SCRATCH-SERIAL>
partition = 1

[vm.run1c]
vcpus = 1
mem_mb = 1024
boot = disk
firmware = uefi
os_hint = linux
disks = bootdisk, exfatscratch
