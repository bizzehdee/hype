; Run 1c (AMD 5950X) -- default build. #653 exFAT real-hardware pass, AMD half.
; Boots the LIVE Alpine ISO (same shape as hype1a.cfg -- no install needed),
; with the exFAT scratch volume attached as the guest's only OTHER disk so
; it can mount and write to it. No boot-disk entry needed at all: install_media
; already satisfies admission's "needs a disk" check on its own.
;
; REPLACE <EXFAT-SCRATCH-SERIAL> with the real serial of the sanctioned
; scratch drive (docs/hw-val-211.md: confirm the sanctioned scratch device on
; THIS 5950X box specifically before filling this in; never a BitLocker or
; otherwise-in-use drive). Partition it exFAT ahead of time from a real OS.
; Input-script: \input\vm0.txt <- stage input-1c/vm0.txt there before this
; boot (input-scripts/exfat-write-test.txt).
; allow_overwrite: #124's non-empty-partition-table guard refuses a real
; drive otherwise. It does NOT replace the runtime dashboard confirm
; (#125) -- that is a manual step at boot, no input-script can do it.
[hype]
config_version = 1
log_level = debug

[disk.exfatscratch]
type = disk
backing = physical
id_match = <EXFAT-SCRATCH-SERIAL>
partition = 1
allow_overwrite = true

[vm.run1c]
vcpus = 1
mem_mb = 1024
boot = installer
install_media = \iso\test.iso
media_disk = DB9876543214E
firmware = uefi
os_hint = linux
disks = exfatscratch
