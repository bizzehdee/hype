; Run 1a (AMD 5950X) -- default build. #641 idle thresholds + #698 TIMERSTALL
; watch, both from one 2-vCPU Alpine boot; input-scripts/reboot-pin.txt pins
; the reboot to vCPU 1 after an idle observation window at the login prompt.
;
; REQUIRES: \hype\disks\alpine2vcpu.img -- a PRE-INSTALLED 2-vCPU-bootable
; Alpine disk image staged ahead of time -- on the EXFAT DATA partition
; (sdd2, EADE-CA36), not the FAT32 boot partition, per this drive's own
; split. target_disk= sugar has no source_disk equivalent (docs/hype-cfg-
; spec.md §7), so this uses the explicit [disk.*] form purely to say WHICH
; partition the image lives on -- source_disk names the DRIVE's own serial
; (115E0735191800123920), same physical USB-SATA SSD as the boot partition,
; different partition; hype's own resolver walks that drive's partitions.
; Input-script: \input\run1a.txt (input-scripts/reboot-pin.txt, staged there).
[hype]
config_version = 1
log_level = debug

[disk.bootdisk]
type = disk
backing = file
path = \hype\disks\alpine2vcpu.img
source_disk = 115E0735191800123920

[vm.run1a]
vcpus = 2
mem_mb = 1024
boot = disk
firmware = uefi
os_hint = linux
disks = bootdisk
