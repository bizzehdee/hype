; Run 4b (either machine) -- default build. #634+#635+#636 together: Windows +
; Linux + BSD running concurrently, console switching, isolation/pinning, and
; dashboard-stats all observed from this ONE session -- only runs at all if
; hype4a.cfg produced \hype\disks\windows.img already.
;
; All three images live on the exFAT data partition (sdd2/EADE-CA36) --
; source_disk names the drive's own serial, same as every other config here.
; No input-script -- console-switch between the three manually to exercise
; #634's own bar and watch the dashboard for #636.
[hype]
config_version = 1
log_level = debug

[disk.windisk]
type = disk
backing = file
path = \hype\disks\windows.img
source_disk = 115E0735191800123920

[disk.alpinedisk]
type = disk
backing = file
path = \hype\disks\alpine2vcpu.img
source_disk = 115E0735191800123920

[disk.freebsddisk]
type = disk
backing = file
path = \hype\disks\freebsd.img
source_disk = 115E0735191800123920

[vm.run4b-win]
vcpus = 2
mem_mb = 4096
boot = disk
firmware = uefi
os_hint = windows
disks = windisk

[vm.run4b-linux]
vcpus = 1
mem_mb = 1024
boot = disk
firmware = uefi
os_hint = linux
disks = alpinedisk

[vm.run4b-bsd]
vcpus = 1
mem_mb = 1024
boot = disk
firmware = uefi
os_hint = bsd
disks = freebsddisk
