; Run 4b (either machine) -- default build. #634+#635+#636 together: Windows +
; Linux + BSD running concurrently, console switching, isolation/pinning, and
; dashboard-stats all observed from this ONE session -- only runs at all if
; hype4a.cfg produced \hype\disks\windows.img already.
;
; Reuses the same Alpine and FreeBSD images as the other runs. No
; input-script -- console-switch between the three manually to exercise
; #634's own bar and watch the dashboard for #636.
[hype]
config_version = 1
log_level = debug

[vm.run4b-win]
vcpus = 2
mem_mb = 4096
boot = disk
firmware = uefi
os_hint = windows
target_disk = file:\hype\disks\windows.img

[vm.run4b-linux]
vcpus = 1
mem_mb = 1024
boot = disk
firmware = uefi
os_hint = linux
target_disk = file:\hype\disks\alpine2vcpu.img

[vm.run4b-bsd]
vcpus = 1
mem_mb = 1024
boot = disk
firmware = uefi
os_hint = bsd
target_disk = file:\hype\disks\freebsd.img
