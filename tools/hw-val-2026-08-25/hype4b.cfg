; Run 4b (either machine) -- default build. #634+#635+#636 together: Windows +
; Linux + BSD running concurrently, console switching, isolation/pinning, and
; dashboard-stats all observed from this ONE session -- only runs at all if
; hype4a.cfg produced \hype\disks\windows.img already.
;
; Windows genuinely needs its real installed disk (no live-boot OOBE
; equivalent); Linux and BSD boot their LIVE ISOs instead (same reasoning as
; every other config here -- #634/#635/#636 need three CONCURRENT OSes, not
; three persisted installs). All resolve via source_disk/media_disk =
; 115E0735191800123920 (sdd2/EADE-CA36, this drive's own serial).
; No input-script -- console-switch between the three manually to exercise
; #634's own bar and watch the dashboard for #636.
[hype]
config_version = 1
log_level = debug

[disk.windisk]
type = disk
backing = file
path = \hype\disks\windows.img
source_disk = 115E0735191800123920

[vm.run4b-win]
vcpus = 2
mem_mb = 4096
boot = disk
firmware = uefi
os_hint = windows
disks = windisk

[vm.run4b-linux]
vcpus = 1
mem_mb = 1024
boot = installer
install_media = \iso\test.iso
media_disk = 115E0735191800123920
firmware = uefi
os_hint = linux
target_disk = file:\hype\disks\run4b-linux-scratch.img
target_disk_size_gb = 2

[vm.run4b-bsd]
vcpus = 1
mem_mb = 1024
boot = installer
install_media = \iso\freebsd-install.iso
media_disk = 115E0735191800123920
firmware = uefi
os_hint = bsd
target_disk = file:\hype\disks\run4b-bsd-scratch.img
target_disk_size_gb = 2
