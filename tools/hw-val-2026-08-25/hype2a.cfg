; Run 2a (Intel i5-13420H) -- default build. #708's own open question: does
; the DEFAULT (non-APICv) build's AP ever get a timer interrupt on a fresh
; 2-vCPU boot with no restart? A timeout on the input-script IS the evidence,
; not a harness failure -- see input-scripts/login-only.txt's own note.
;
; REQUIRES: the SAME \hype\disks\alpine2vcpu.img used in Run 1, on the same
; portable drive's EXFAT DATA partition (sdd2/EADE-CA36) -- this is the
; "already boot-verified 2-vCPU image" the runbook reuses across 2a/2b/2c.
; source_disk names the drive's own serial (same physical USB-SATA SSD,
; different partition than the FAT32 boot one); target_disk= sugar has no
; source_disk equivalent, hence the explicit [disk.*] form here.
; Input-script: \input\run2a.txt (input-scripts/login-only.txt).
[hype]
config_version = 1
log_level = debug

[disk.bootdisk]
type = disk
backing = file
path = \hype\disks\alpine2vcpu.img
source_disk = 115E0735191800123920

[vm.run2a]
vcpus = 2
mem_mb = 1024
boot = disk
firmware = uefi
os_hint = linux
disks = bootdisk
