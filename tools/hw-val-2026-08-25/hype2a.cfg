; Run 2a (Intel i5-13420H) -- default build. #708's own open question: does
; the DEFAULT (non-APICv) build's AP ever get a timer interrupt on a fresh
; 2-vCPU boot with no restart? A timeout on the input-script IS the evidence,
; not a harness failure -- see input-scripts/login-only.txt's own note.
;
; REQUIRES: the SAME \hype\disks\alpine2vcpu.img used in Run 1, copied onto
; (or already present on) this machine/medium -- this is the "already
; boot-verified 2-vCPU image" the runbook reuses across boots 2a/2b/2c.
; Input-script: \input\run2a.txt (input-scripts/login-only.txt).
[hype]
config_version = 1
log_level = debug

[vm.run2a]
vcpus = 2
mem_mb = 1024
boot = disk
firmware = uefi
os_hint = linux
target_disk = file:\hype\disks\alpine2vcpu.img
