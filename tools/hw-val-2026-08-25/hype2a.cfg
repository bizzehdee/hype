; Run 2a (Intel i5-13420H) -- default build. #708's own open question: does
; the DEFAULT (non-APICv) build's AP ever get a timer interrupt on a fresh
; 2-vCPU boot with no restart? A timeout on the input-script IS the evidence,
; not a harness failure -- see input-scripts/login-only.txt's own note.
;
; Boots the LIVE Alpine ISO fresh (same proven shape as tools/525's own rig
; and hype1a.cfg) -- no install needed. media_disk/target_disk both resolve
; to sdd2/EADE-CA36 via this drive's own serial (DB9876543214E);
; target_disk is a throwaway scratch file hype creates on demand.
; Input-script: \input\vm0.txt <- stage input-2a/vm0.txt there before this boot
; (input-scripts/login-only.txt).
[hype]
config_version = 1
log_level = debug

[vm.run2a]
vcpus = 2
mem_mb = 1024
boot = installer
install_media = \iso\test.iso
media_disk = DB9876543214E
firmware = uefi
os_hint = linux
target_disk = file:\hype\disks\run2a-scratch.img
target_disk_size_gb = 2
