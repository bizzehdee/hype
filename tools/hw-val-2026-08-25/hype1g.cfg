; Boot AMD-1 (5950X) -- default build. The input set AND the SMP legs in one boot:
;   #525/#698 (SVM legs)  \input\vm0.txt = input-1a/vm0.txt (reboot-pin): login, pin the reboot to
;                         CPU 1, reboot, log in again, then idle. Arm the Pico AFTER the second login.
;   #603 (SVM leg)        hype1b.cfg's three microtests, verbatim, alongside.
;   #426 #775 #790 #641   the 90-minute input run, as boots 40-42.
; vm0 MUST stay first: hype loads \input\vm0.txt by position. 2 + 2 + 1 + 1 = 6 vCPUs + BSP.
[hype]
config_version = 1
log_level = debug
[vm.run1a]
vcpus = 2
mem_mb = 1024
boot = installer
install_media = \iso\test.iso
media_disk = DB9876543214E
firmware = uefi
os_hint = linux
target_disk = file:\hype\disks\run1a-scratch.img
target_disk_size_gb = 2
[vm.vmexit]
label = micro/vmexit
vcpus = 2
mem_mb = 512
boot = kernel
kernel = \EFI\hype\micro\vmexit.bin
os_hint = none
[vm.vmexitstorm]
label = micro/vmexitstorm
vcpus = 1
mem_mb = 512
boot = kernel
kernel = \EFI\hype\micro\vmexitstorm.bin
os_hint = none
[vm.hello]
label = micro/hello
vcpus = 1
mem_mb = 512
boot = kernel
kernel = \EFI\hype\micro\hello.bin
os_hint = none
