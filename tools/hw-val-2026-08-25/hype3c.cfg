; Run 3c (either machine) -- default build. #715+#660+#713+#426 together: two
; VMs running a concurrent write workload, one against the physical NVMe
; target, one against a physical AHCI target -- exactly the load #713's
; stall repro and #660's criterion 2 both need, and exercises the same
; AHCI/NVMe/xHCI migration #426's HW-VAL gate wants. Both boot the LIVE
; Alpine ISO (no install needed); install_media alone satisfies admission's
; "needs a disk" check per VM, so no separate boot-disk entry either.
;
; NVMe serial is REAL (#715's own hwstick): 5ME3N005713803V2W.
; REPLACE <AHCI-SCRATCH-SERIAL> with a real, sanctioned AHCI/SATA scratch
; drive's serial (docs/hw-val-211.md's exclusions apply -- never BitLocker,
; never a known-dying drive).
; Input-scripts (VM order below IS the vm0/vm1 index -- see run-card note in
; docs/hw-val-runbook-2026-08-25.md): \input\vm0.txt <- input-3c/vm0.txt
; (nvme-dd-write.txt), \input\vm1.txt <- input-3c/vm1.txt (ahci-dd-write.txt).
; allow_overwrite: #124's non-empty-partition-table guard refuses a real
; drive otherwise. It does NOT replace the runtime dashboard confirm
; (#125) -- that is a manual step at boot, no input-script can do it.
[hype]
config_version = 1
log_level = debug

[disk.nvmescratch]
type = disk
backing = physical
bus = nvme
id_match = 5ME3N005713803V2W
allow_overwrite = true

[vm.run3c-nvme]
vcpus = 1
mem_mb = 1024
boot = installer
install_media = \iso\test.iso
media_disk = DB9876543214E
firmware = uefi
os_hint = linux
disks = nvmescratch

[disk.ahciscratch]
type = disk
backing = physical
bus = ahci-sata
id_match = <AHCI-SCRATCH-SERIAL>
allow_overwrite = true

[vm.run3c-ahci]
vcpus = 1
mem_mb = 1024
boot = installer
install_media = \iso\test.iso
media_disk = DB9876543214E
firmware = uefi
os_hint = linux
disks = ahciscratch
