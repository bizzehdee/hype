; Run 4a (either machine) -- default build. #442/#695: fresh Windows install
; to a FILE-backed disk (not physical) -- the resulting .img IS #695's own
; deliverable (a reusable, archivable installed Windows guest image), which
; only works if it is a file, not a physical drive.
;
; REQUIRES: \iso\windows.iso -- the Windows install ISO on the boot medium.
; No input-script -- drive this one interactively from hype's own dashboard/
; terminal (real Windows Setup + OOBE need real interaction). #436 (the
; upstream install-media blocker) is closed, so this should reach Setup at all.
[hype]
config_version = 1
log_level = debug

[vm.run4a]
vcpus = 2
mem_mb = 4096
boot = installer
install_media = \iso\windows.iso
firmware = uefi
os_hint = windows
target_disk = file:\hype\disks\windows.img
target_disk_size_gb = 40
