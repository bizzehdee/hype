; Run 4a (either machine) -- default build. #442/#695: fresh Windows install
; to a FILE-backed disk (not physical) -- the resulting .img IS #695's own
; deliverable (a reusable, archivable installed Windows guest image), which
; only works if it is a file, not a physical drive.
;
; REQUIRES: \iso\windows.iso -- the Windows install ISO, on the exFAT DATA
; partition (sdd2/EADE-CA36) per this drive's split -- media_disk names the
; drive's own serial the same way hype-ntfs689.cfg's own established
; convention on this stick already does. windows.img MUST ALREADY EXIST on
; sdd2, fully allocated at the size below -- an earlier version of this comment
; said hype created it fresh at first boot from size_gb, and that is wrong:
; [disk.*] size_gb is parsed and serialized but nothing reads it (#740), and
; hype has no post-ExitBootServices filesystem allocator at all (#331, #738).
; Create it with hype's own `mkdisk` at the terminal, or on the host.
; No input-script -- drive this one interactively from hype's own dashboard/
; terminal (real Windows Setup + OOBE need real interaction). #436 (the
; upstream install-media blocker) is closed, so this should reach Setup at all.
[hype]
config_version = 1
log_level = debug

[disk.windisk]
type = disk
backing = file
path = \hype\disks\windows.img
source_disk = DB9876543214E
size_gb = 40

[vm.run4a]
vcpus = 2
mem_mb = 4096
boot = installer
install_media = \iso\windows.iso
media_disk = DB9876543214E
firmware = uefi
os_hint = windows
disks = windisk
