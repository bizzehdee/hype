; Run 2e (Intel i5-13420H) -- default build. #577: FreeBSD hangs at
; lapic_et_start during LAPIC timer calibration -- HPET layer already fixed
; (2d2e40f); this boot samples the DEEPER layer's own advance()-call cadence.
; The hang happens during EARLY boot (timer calibration), well before the
; installer ever touches storage, so the FreeBSD install ISO itself
; reproduces it -- no pre-installed disk image needed at all. A hang here IS
; the reproduction, not a failure -- see docs/hw-val-runbook-2026-08-25.md's
; "Build changes needed" note: if the existing KRIPHIST diagnostic (RT-2c)
; doesn't give enough resolution once you're looking at the log, that's the
; signal to build the extra sampling instrumentation BEFORE this boot, not
; after finding it insufficient here.
;
; install_media/target_disk resolve via media_disk/source_disk =
; DB9876543214E (sdd2/EADE-CA36, this drive's own serial).
; No input-script needed -- this is an observed hang, not a scripted pass/fail.
[hype]
config_version = 1
log_level = debug

[vm.run2e]
vcpus = 2
mem_mb = 1024
boot = installer
install_media = \iso\freebsd-install.iso
media_disk = DB9876543214E
firmware = uefi
os_hint = bsd
target_disk = file:\hype\disks\run2e-scratch.img
target_disk_size_gb = 2
