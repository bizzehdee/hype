; Boots 1a AND 1b from ONE host boot (AMD 5950X, 16 cores / 32 threads).
;
; 1a is a 2-vCPU Alpine session that must idle QUIETLY for 30 minutes -- #641's
; thresholds (HLT/s, TMRLATE under load) were originally measured over a
; 26-minute window, and a noisy host makes the sample inconclusive rather than
; merely smaller. 1b's `vmexitstorm` exists to trip hype's per-vCPU watchdog by
; flooding exits. Running the two AT THE SAME TIME would poison exactly the
; numbers 1a is here to produce, so they must not both be live during 1a's
; window.
;
; They are separated in TIME, not by boot: only run1a starts. The three micro
; VMs are held OFF by \hype-state.txt (#177's run-state record -- see
; hype-state-1ab.txt beside this file), which is read at startup and leaves any
; VM it lists as `stopped` in the OFF state. After 1a's script prints
; `pass reboot-pin-nonbsp` and the 30 minutes are up, bring them up by hand at
; the hype terminal:
;
;     poweroff run1a        <- optional; see the runbook note
;     start vmexit
;     start vmexitstorm
;     start hello
;
; NOTE: `autostart = none` in [hype] would be the obvious way to express this
; and it does NOT work -- the key parses and validates but nothing consumes it
; (#732). The run-state record is the mechanism that is actually implemented.
;
; Budget: 2 + 2 + 1 + 1 = 6 physical cores of 16, and 1024 + 512*3 = 2560 MB.
;
; run1a MUST stay the FIRST section: hype auto-loads \input\vm<N>.txt by a VM's
; 0-based position in this file, not by name, so the reboot-pin script only
; reaches the Alpine guest while it is vm0. The micro VMs need no input script,
; and an absent \input\vm1.txt is silently fine.
;
; Per-VM sections below are verbatim from hype1a.cfg and hype1b.cfg.
[hype]
config_version = 1
log_level = debug

; ---- Boot 1a: #641 idle thresholds + #698 TIMERSTALL, one 2-vCPU Alpine boot.
; Boots the LIVE Alpine ISO fresh (root login is passwordless in live mode);
; target_disk exists purely to satisfy admission's "needs a disk" check and is
; never installed to -- but it MUST ALREADY EXIST, fully allocated, on the
; volume. hype creates nothing (#331, #738). Both it and the
; ISO resolve via media_disk = DB9876543214E -- the USB-SATA BRIDGE's serial as
; hype reports it, NOT the number lsblk shows for the disk behind it.
[vm.run1a]
vcpus = 2
mem_mb = 1024
boot = installer
install_media = \iso\test.iso
media_disk = DB9876543214E
firmware = uefi
os_hint = linux
target_disk = file:\hype\disks\run1a-scratch.img
target_disk_size_gb = 2

; ---- Boot 1b: #603 systematic VM-exit coverage. vmexit walks every non-fatal
; exit reason and ends in a deliberate triple fault; vmexitstorm deliberately
; trips the #171 per-vCPU watchdog so hype force-powers THAT VM off alone; hello
; is the healthy control that must still PASS after both of the others have
; ended themselves by different mechanisms -- that is the Sec 6g isolation bar.
[vm.vmexit]
label = micro/vmexit
vcpus = 2
mem_mb = 512
boot = kernel
kernel = \EFI\hype\micro\vmexit.bin
os_hint = none

[vm.vmexitstorm]
label = micro/vmexitstorm
vcpus = 1
mem_mb = 512
boot = kernel
kernel = \EFI\hype\micro\vmexitstorm.bin
os_hint = none

[vm.hello]
label = micro/hello
vcpus = 1
mem_mb = 512
boot = kernel
kernel = \EFI\hype\micro\hello.bin
os_hint = none
