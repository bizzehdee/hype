; Run 3a (either machine) -- default build. #387+#388: install from a SECOND
; serialized USB stick (not the boot medium), writing to that same stick as
; the physical target. Boot medium = whatever stick carries hype.efi + this
; cfg; target/media stick is a SEPARATE, separately-serialized USB drive.
;
; REPLACE <STICK-B-SERIAL> with the second stick's real serial (`lsusb`/
; `blkid` from a real OS beforehand). install_media's own ISO must live ON
; that same stick B for this to exercise #387's claim-by-media_disk path.
[hype]
config_version = 1
log_level = debug

[vm.run3a]
vcpus = 1
mem_mb = 1024
boot = installer
install_media = \iso\test.iso
media_disk = <STICK-B-SERIAL>
firmware = uefi
os_hint = linux
target_disk = physical:<STICK-B-SERIAL>
