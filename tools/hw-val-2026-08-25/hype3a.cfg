; Run 3a (either machine) -- default build. #387 ONLY, and deliberately
; READ-ONLY: two serialized USB sticks on one root hub, with the install media
; streamed from the SECOND stick while hype's log keeps draining to the first.
;
; #388 (the physical: USB write target) was SPLIT OUT to hype3d.cfg. The two
; cannot share a boot the way this file originally tried to: it had
; media_disk = <STICK-B-SERIAL> together with target_disk =
; physical:<STICK-B-SERIAL>, and the physical: sugar means partition = whole
; (spec §7). hype would have streamed \iso\test.iso off a filesystem on stick B
; while the guest wrote raw sectors across the whole of that same stick --
; destroying the install media mid-install. Read-only here; the write leg gets
; its own sanctioned scratch stick.
;
; #387's bar, from the ticket's own Validation section:
;   1. both sticks appear as `media: registered host device N = usb serial=...`
;   2. media_disk = <B> resolves and streams from B, and never probes the other
;   3. concurrent guest ISO reads off B, while the log drains to stick 0, stay
;      corruption-free
; This config is shaped at (2) and (3); (1) is satisfied by ANY boot with both
; sticks present, which is the cheap way to harvest B's serial for this file.
;
; PREPARE STICK B: any FAT32/exFAT partition carrying \iso\test.iso (the same
; Alpine 3.21.7 ISO). Nothing is written to it.
;
; REPLACE <STICK-B-SERIAL> with the serial from HYPE'S OWN LOG -- the
; `media: registered host device N = usb serial='...'` line, or the
; `host-xhci: MSC identity serial='...' source=inquiry-vpd80` line above it.
; NOT from lsusb/blkid/lsblk: hype identifies USB mass storage by SCSI INQUIRY
; VPD page 0x80, which behind any USB-SATA bridge is the ENCLOSURE's serial and
; not the disk's. Getting this wrong is what broke Boot 2a -- see
; RUNBOOK-README.md's serial note.
;
; target_disk is a throwaway file on the BOOT stick (device 0), deliberately
; NOT on stick B: it satisfies admission's "needs a disk" check without giving
; the guest any reason to write to the stick under test.
[hype]
config_version = 1
log_level = debug

[vm.run3a]
vcpus = 1
mem_mb = 1024
boot = installer
install_media = \iso\test.iso
media_disk = <STICK-B-SERIAL>
firmware = uefi
os_hint = linux
target_disk = file:\hype\disks\run3a-scratch.img
target_disk_size_gb = 2
