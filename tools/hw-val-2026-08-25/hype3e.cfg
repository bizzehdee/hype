; Run 3e (either machine) -- default build. #388's NEGATIVE test, and it is
; expected to REFUSE, not to boot.
;
; #388 rule 3: "hype's own boot/log medium is never a target, whatever its
; serial: refuse by the inventory's HYPE_USB_OWNER_HYPE claim (identity, not
; position)." That is one of the ticket's own Validation bullets and it cannot
; be proven by the positive test in hype3d.cfg -- a run where the write lands
; correctly says nothing about whether naming the WRONG device would have been
; caught.
;
; This names hype's own boot/log stick (DB9876543214E, the 512 GB USB-SATA
; drive this runbook boots from) as a physical write target. hype must refuse
; it. Watch the log for the refusal naming the owner claim, and confirm the VM
; does NOT start with that disk attached.
;
; PASS = refused. FAIL = the VM starts and the disk is presented -- which would
; mean hype will let a guest write over its own boot medium and log.
;
; Nothing else is needed on the machine for this: no scratch stick, no second
; media stick. It is a config-only, seconds-long boot. Run it right after
; hype3d.cfg while the same hardware is still plugged in.
[hype]
config_version = 1
log_level = debug

[disk.bootmedium]
type = disk
backing = physical
id_match = DB9876543214E
partition = whole
allow_overwrite = true

[vm.run3e]
vcpus = 1
mem_mb = 1024
boot = installer
install_media = \iso\test.iso
media_disk = DB9876543214E
firmware = uefi
os_hint = linux
disks = bootmedium
