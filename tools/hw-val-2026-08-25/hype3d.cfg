; Run 3d (either machine) -- default build. #388: target_disk = physical on a
; USB stick, the third bus in the chain. Split out of hype3a.cfg, which tried
; to run this and #387 from one boot with the SAME stick serving as both the
; install media and the whole-disk write target -- self-destructive, since the
; ISO lives on a filesystem the raw write would overwrite.
;
; #388's bar: the physical: target write lands ONLY on the named stick.
;
; THIS BOOT WRITES TO A REAL USB STICK AND DESTROYS ITS CONTENTS.
; <USB-TARGET-SERIAL> must be a sanctioned scratch stick -- NOT stick B from
; hype3a.cfg (that one carries the install media), NOT the boot stick, and
; subject to docs/hw-val-211.md's standing exclusions. By serial only, never
; by index.
;
; allow_overwrite is required if the stick has a partition table: #124's
; non-empty-table guard refuses it otherwise. The explicit [disk.*] form is
; used because the `target_disk = physical:<serial>` sugar has no
; allow_overwrite key (spec §7 maps it to {backing=physical, id_match=...,
; partition=whole} and nothing else). It does NOT replace the runtime
; dashboard confirm (#125) -- that is a manual step at boot; no input-script
; can do it.
;
; Install media comes from the BOOT stick here (device 0), not from the target,
; so the media source and the write target are different devices by
; construction.
;
; REPLACE <USB-TARGET-SERIAL> with the serial from HYPE'S OWN LOG -- the
; `media: registered host device N = usb serial='...'` line. NOT lsusb/blkid:
; hype reads SCSI INQUIRY VPD page 0x80, which behind a USB bridge is the
; enclosure's serial. See RUNBOOK-README.md's serial note.
[hype]
config_version = 1
log_level = debug

[disk.usbtarget]
type = disk
backing = physical
id_match = <USB-TARGET-SERIAL>
partition = whole
allow_overwrite = true

[vm.run3d]
vcpus = 1
mem_mb = 1024
boot = installer
install_media = \iso\test.iso
media_disk = DB9876543214E
firmware = uefi
os_hint = linux
disks = usbtarget
