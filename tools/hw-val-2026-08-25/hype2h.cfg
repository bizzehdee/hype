; Boot 1 of docs/hw-validation-queue-2026-09-09.md (Intel i5-13420H) -- APICv EXTRA
; BUILD (-DHYPE_ENABLE_APICV=1). Four VMs, three of them autostarted:
;
;   run2c  2 vCPUs  #708 #599 #605 -- IDENTICAL to hype2c.cfg's VM, login only, then idle.
;                   \input\vm0.txt = input-2h/vm0.txt (login-only, 20-minute timeout).
;   run2e  1 vCPU   #688 -- its ISO and its scratch image live ONLY on the drive's ext4
;                   partition (p3). The path resolver walks p1..p4 and takes the first
;                   volume holding the path, so the paths below must not exist on p2.
;                   \input\vm1.txt: signature write + read-back + 64 MiB bulk.
;   run2n  1 vCPU   #689 -- the same on the NTFS partition (p4). Distinct file names so
;                   the resolver cannot satisfy them from ext4 first. \input\vm2.txt.
;   run3d  1 vCPU   #388 + #754 -- NOT autostarted. `start run3d` at the dashboard is the
;                   LAST act of the run; `confirm` arms the write. Target = the 8 GB
;                   SanDisk scratch stick by hype's own VPD-0x80 serial (hype3d.cfg's
;                   provenance). \input\vm3.txt writes 6000 MiB so the operator has
;                   minutes to pull the stick mid-write.
;
; The internal NVMe is BitLocker Windows and is named nowhere in this file. Every file
; path is on DB9876543214E, the hw-val drive; the only physical target is the SanDisk.
;
; mkdisk cannot create on a USB-attached disk (TERM-11 lists ahci|nvme only), so the
; #688/#689 "mkdisk on the data partition" clause is discharged with a fully allocated
; image staged by stage.sh and written in place by the guest -- recorded on both tickets.
[hype]
config_version = 1
log_level = debug
autostart = run2c, run2e, run2n

[vm.run2c]
vcpus = 2
mem_mb = 1024
boot = installer
install_media = \iso\test.iso
media_disk = DB9876543214E
firmware = uefi
os_hint = linux
target_disk = file:\hype\disks\run2c-scratch.img
target_disk_size_gb = 2

[vm.run2e]
vcpus = 1
mem_mb = 512
boot = installer
install_media = \iso\test.iso
media_disk = DB9876543214E
firmware = uefi
os_hint = linux
target_disk = file:\hype\disks\ext4-scratch.img
target_disk_size_gb = 1

[vm.run2n]
vcpus = 1
mem_mb = 512
boot = installer
install_media = \iso\ntfs-test.iso
media_disk = DB9876543214E
firmware = uefi
os_hint = linux
target_disk = file:\hype\disks\ntfs-scratch.img
target_disk_size_gb = 1

[disk.usbtarget]
type = disk
backing = physical
id_match = 4C530201070308103214
partition = whole
allow_overwrite = true

[vm.run3d]
vcpus = 1
mem_mb = 512
boot = installer
install_media = \iso\test.iso
media_disk = DB9876543214E
firmware = uefi
os_hint = linux
disks = usbtarget
