; DIAGNOSTIC ONLY -- not Boot 1a. #733: Alpine hangs ~5s into kernel init on
; bare-metal SVM with all four vCPUs spinning on RDTSC. This is hype1a.cfg with
; vcpus = 1 to split the search space: if a single-vCPU guest boots, the fault is
; in cross-vCPU timebase or AP bring-up; if it hangs identically, it is
; single-CPU early init and the vCPU count is irrelevant.
;
; This CANNOT stand in for 1a -- #698's leg needs a non-BSP vCPU to pin the
; reboot to, and vcpus = 1 has none. Run it, read the verdict, then go back to
; hype1a.cfg.
;
; \input\vm0.txt (reboot-pin) will not complete under this config and is not
; expected to; what matters is only whether the agetty banner appears at all.
;
; Run 1a (AMD 5950X) -- default build. #641 idle thresholds + #698 TIMERSTALL
; watch, both from one 2-vCPU Alpine boot; input-scripts/reboot-pin.txt pins
; the reboot to vCPU 1 after an idle observation window at the login prompt.
;
; Boots the LIVE Alpine ISO fresh, same proven shape as tools/525's own rig
; (input-scripts/reboot-pin.txt IS that script) -- no install needed, live
; mode's root login is passwordless. target_disk exists only to satisfy
; admission's "needs a disk" check and is never actually installed to -- but
; it MUST ALREADY EXIST, fully allocated, on the volume. hype creates nothing
; (#331); see hype1a.cfg and #738. install_media/target_disk both resolve via
; media_disk/source_disk = DB9876543214E (this drive's own serial --
; both the ISO and the scratch file live on sdd2/EADE-CA36, not the FAT32
; boot partition sdd1).
; Input-script: \input\vm0.txt -- hype auto-loads by the VM's 0-based position in
; this file, NOT by [vm.name]. Staged from input-1a/ (input-scripts/reboot-pin.txt).
[hype]
config_version = 1
log_level = debug

[vm.run1a]
vcpus = 1
mem_mb = 1024
boot = installer
install_media = \iso\test.iso
media_disk = DB9876543214E
firmware = uefi
os_hint = linux
target_disk = file:\hype\disks\run1a-scratch.img
target_disk_size_gb = 2
