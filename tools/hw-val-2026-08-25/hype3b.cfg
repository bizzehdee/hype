; Run 3b (either machine) -- default build. #688+#689 together: one USB-SATA
; drive, ESP(FAT32) + ext4 data + NTFS data partitions all at once -- proves
; both tickets' bars from one cold boot instead of two. Boots the LIVE
; Alpine ISO as the driver OS (no install needed), with the USB-SATA drive
; attached WHOLE as the single disk -- install_media alone satisfies
; admission's "needs a disk" check, so no separate boot-disk entry.
;
; WHOLE disk, not three partition= entries. hype presents at most ONE
; physical-backed disk per VM: boot/main.c's extra-slot loop skips any slot
; past 0 whose backing is physical ("only the FIRST attached disk may be
; physical -- NOT presented"), so the earlier three-entry form would have
; handed the guest the FAT32 partition and silently dropped ext4 and NTFS.
; Whole-disk exposure gives all three as \dev\vda1..3 in one go, which is
; what the input-script wants anyway.
;
; allow_overwrite is required: the drive has a real partition table, so
; #124's non-empty-table guard refuses it otherwise. This is on top of, not
; instead of, the runtime dashboard confirm (#125) -- expect to approve the
; physical target by hand at boot; no input-script can do that step.
;
; REPLACE <USB-SATA-SERIAL> with the serial hype's OWN log reports for #218's
; stick (the `media: registered host device N = ...` line), NOT the one lsblk
; shows -- see RUNBOOK-README.md's serial note.
; Partition it ahead of time from a real OS: p1=FAT32(ESP-sized), p2=ext4,
; p3=NTFS -- 4 GiB total per #688/#689's own titles.
; Input-script: \input\vm0.txt <- stage input-3b/vm0.txt there before this
; boot (input-scripts/usbsata-triple-write.txt).
[hype]
config_version = 1
log_level = debug

[disk.usbwhole]
type = disk
backing = physical
id_match = <USB-SATA-SERIAL>
partition = whole
allow_overwrite = true

[vm.run3b]
vcpus = 1
mem_mb = 1024
boot = installer
install_media = \iso\test.iso
media_disk = DB9876543214E
firmware = uefi
os_hint = linux
disks = usbwhole
