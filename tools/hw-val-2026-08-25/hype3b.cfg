; Run 3b (either machine) -- default build. #688+#689 together: one USB-SATA
; drive, ESP(FAT32) + ext4 data + NTFS data partitions all at once -- proves
; both tickets' bars from one cold boot instead of two. Boots the LIVE
; Alpine ISO as the driver OS (no install needed), with all three partitions
; of the USB-SATA stick attached as additional disks -- install_media alone
; satisfies admission's "needs a disk" check, so no separate boot-disk entry.
;
; REPLACE <USB-SATA-SERIAL> with the real serial of #218's own stick.
; Partition it ahead of time from a real OS: p1=FAT32(ESP-sized), p2=ext4,
; p3=NTFS -- 4 GiB total per #688/#689's own titles.
; Input-script: \input\vm0.txt <- stage input-3b/vm0.txt there before this
; boot (input-scripts/usbsata-triple-write.txt).
[hype]
config_version = 1
log_level = debug

[disk.usbfat32]
type = disk
backing = physical
id_match = <USB-SATA-SERIAL>
partition = 1

[disk.usbext4]
type = disk
backing = physical
id_match = <USB-SATA-SERIAL>
partition = 2

[disk.usbntfs]
type = disk
backing = physical
id_match = <USB-SATA-SERIAL>
partition = 3

[vm.run3b]
vcpus = 1
mem_mb = 1024
boot = installer
install_media = \iso\test.iso
media_disk = 115E0735191800123920
firmware = uefi
os_hint = linux
disks = usbfat32, usbext4, usbntfs
