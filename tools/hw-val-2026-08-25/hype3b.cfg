; Run 3b (either machine) -- default build. #688+#689 together: one USB-SATA
; drive, ESP(FAT32) + ext4 data + NTFS data partitions all at once -- proves
; both tickets' bars from one cold boot instead of two. Boots the usual
; Alpine driver image, with all three partitions of the USB-SATA stick
; attached as additional disks.
;
; REPLACE <USB-SATA-SERIAL> with the real serial of #218's own stick.
; Partition it ahead of time from a real OS: p1=FAT32(ESP-sized), p2=ext4,
; p3=NTFS -- 4 GiB total per #688/#689's own titles.
[hype]
config_version = 1
log_level = debug

[disk.bootdisk]
type = disk
backing = file
path = \hype\disks\alpine2vcpu.img
source_disk = 115E0735191800123920

[disk.usbfat32]
type = disk
backing = physical
id_match = <USB-SATA-SERIAL>
partition = 1

[disk.usbext4]
type = disk
backing = physical
id_match = <USB-SATA-SERIAL>
partition = 2

[disk.usbntfs]
type = disk
backing = physical
id_match = <USB-SATA-SERIAL>
partition = 3

[vm.run3b]
vcpus = 1
mem_mb = 1024
boot = disk
firmware = uefi
os_hint = linux
disks = bootdisk, usbfat32, usbext4, usbntfs
