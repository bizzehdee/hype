; Run 2c (Intel i5-13420H) -- APICv EXTRA BUILD (-DHYPE_ENABLE_APICV=1), NOT
; the default build. Config is intentionally IDENTICAL to hype2a.cfg -- the
; only thing that differs for this boot is which hype.efi is active at
; \EFI\BOOT\BOOTX64.EFI. Direct comparison against 2a's own result answers
; #599/#605/#708 together (see docs/hw-val-runbook-2026-08-25.md).
;
; Same guest image as 2a/2b, on the exFAT data partition (sdd2/EADE-CA36) --
; see hype2a.cfg's own comment for why this uses the explicit [disk.*] form.
; Input-script: \input\run2c.txt (input-scripts/login-only.txt -- the SAME
; file staged for 2a).
[hype]
config_version = 1
log_level = debug

[disk.bootdisk]
type = disk
backing = file
path = \hype\disks\alpine2vcpu.img
source_disk = 115E0735191800123920

[vm.run2c]
vcpus = 2
mem_mb = 1024
boot = disk
firmware = uefi
os_hint = linux
disks = bootdisk
