; Run 2c (Intel i5-13420H) -- APICv EXTRA BUILD (-DHYPE_ENABLE_APICV=1), NOT
; the default build. Config is intentionally IDENTICAL to hype2a.cfg -- the
; only thing that differs for this boot is which hype.efi is active at
; \EFI\BOOT\BOOTX64.EFI. Direct comparison against 2a's own result answers
; #599/#605/#708 together (see docs/hw-val-runbook-2026-08-25.md).
;
; Boots the LIVE Alpine ISO fresh (same shape as 2a/2b) -- no install needed.
; Input-script: \input\vm0.txt <- stage input-2c/vm0.txt there before this
; boot (input-scripts/login-only.txt -- the SAME file staged for 2a).
[hype]
config_version = 1
log_level = debug

[vm.run2c]
vcpus = 2
mem_mb = 1024
boot = installer
install_media = \iso\test.iso
media_disk = DB9876543214E
firmware = uefi
os_hint = linux
target_disk = file:\hype\disks\run2c-scratch.img
target_disk_size_gb = 2
