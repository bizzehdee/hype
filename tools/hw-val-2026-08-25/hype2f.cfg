; Run 2f (Intel i5-13420H) -- default build. #653 exFAT real-hardware pass,
; Intel half. Same shape as hype1c.cfg -- see that file's own comments for
; the scratch-drive safety note (confirm the sanctioned scratch device on
; THIS machine specifically; docs/hw-val-211.md's exclusions are per-machine).
;
; REPLACE <EXFAT-SCRATCH-SERIAL-INTEL> with the real serial of Intel's own
; sanctioned scratch drive. Input-script: \input\run2f.txt
; (input-scripts/exfat-write-test.txt -- the SAME file staged for 1c).
[hype]
config_version = 1
log_level = debug

[disk.bootdisk]
type = disk
backing = file
path = \hype\disks\alpine2vcpu.img

[disk.exfatscratch]
type = disk
backing = physical
id_match = <EXFAT-SCRATCH-SERIAL-INTEL>
partition = 1

[vm.run2f]
vcpus = 1
mem_mb = 1024
boot = disk
firmware = uefi
os_hint = linux
disks = bootdisk, exfatscratch
