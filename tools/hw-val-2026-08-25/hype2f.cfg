; Run 2f (Intel i5-13420H) -- default build. #653 exFAT real-hardware pass,
; Intel half. Boots the LIVE Alpine ISO (same shape as hype1c.cfg -- no
; install needed), with the exFAT scratch volume attached as the guest's
; only OTHER disk. See hype1c.cfg's own comments for the scratch-drive
; safety note (confirm the sanctioned scratch device on THIS machine
; specifically; docs/hw-val-211.md's exclusions are per-machine).
;
; REPLACE <EXFAT-SCRATCH-SERIAL-INTEL> with the real serial of Intel's own
; sanctioned scratch drive. Input-script: \input\vm0.txt <- stage
; input-2f/vm0.txt there before this boot (input-scripts/exfat-write-test.txt
; -- the SAME file staged for 1c).
; allow_overwrite: #124's non-empty-partition-table guard refuses a real
; drive otherwise. It does NOT replace the runtime dashboard confirm
; (#125) -- that is a manual step at boot, no input-script can do it.
[hype]
config_version = 1
log_level = debug

[disk.exfatscratch]
type = disk
backing = physical
id_match = <EXFAT-SCRATCH-SERIAL-INTEL>
partition = 1
allow_overwrite = true

[vm.run2f]
vcpus = 1
mem_mb = 1024
boot = installer
install_media = \iso\test.iso
media_disk = DB9876543214E
firmware = uefi
os_hint = linux
disks = exfatscratch
