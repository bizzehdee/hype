; Boot A (Intel, VMX) -- default build. ONE boot for four tickets' VMX legs:
;   #525  the 0xCF9 restart driven from vCPU 1 reaches a second login (input-2b/vm0.txt)
;   #698  vm0/1's LAPIC timer keeps delivering after that restart (TMRLATE vm0/1 climbing)
;   #729  micro/vmexit's MSR round-trip probe reads back the MTRR it wrote (not 0)
;   #603  the VMX leg of the exit-coverage suite: vmexit + vmexitstorm end themselves, hello PASSes
;
; vm0 is the Alpine reboot-pin guest and MUST stay first: hype loads \input\vm0.txt by the VM's
; 0-based position in this file, not by its name. The three microtests are hype2d.cfg's, verbatim.
; Six vCPUs plus the BSP = seven physical cores. If admission refuses on a smaller machine, fall
; back to hype2b.cfg (Alpine only) and then hype2d.cfg (suite only): two boots instead of one.
[hype]
config_version = 1
log_level = debug
[vm.run2b]
vcpus = 2
mem_mb = 1024
boot = installer
install_media = \iso\test.iso
media_disk = DB9876543214E
firmware = uefi
os_hint = linux
target_disk = file:\hype\disks\run2b-scratch.img
target_disk_size_gb = 2
[vm.vmexit]
label = micro/vmexit
vcpus = 2
mem_mb = 512
boot = kernel
kernel = \EFI\hype\micro\vmexit.bin
os_hint = none
[vm.vmexitstorm]
label = micro/vmexitstorm
vcpus = 1
mem_mb = 512
boot = kernel
kernel = \EFI\hype\micro\vmexitstorm.bin
os_hint = none
[vm.hello]
label = micro/hello
vcpus = 1
mem_mb = 512
boot = kernel
kernel = \EFI\hype\micro\hello.bin
os_hint = none
