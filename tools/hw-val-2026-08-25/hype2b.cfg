; Run 2b (Intel i5-13420H) -- default build. #525's VMX leg: pin the reboot to
; the non-BSP vCPU, same shape as SVM's already-proven leg. Only proceed to
; this boot once 2a is known to boot clean -- if 2a hung, this one will too,
; for the same underlying reason (#708).
;
; Boots the LIVE Alpine ISO fresh (same shape as 2a/1a) -- no install needed.
; Input-script: \input\vm0.txt <- stage input-2b/vm0.txt there before this
; boot (input-scripts/reboot-pin.txt -- the SAME file staged for 1a).
[hype]
config_version = 1
log_level = debug

[vm.run2b]
vcpus = 2
mem_mb = 1024
boot = installer
install_media = \iso\test.iso
media_disk = DB9876543214E
firmware = uefi
os_hint = linux
target_disk = file:\hype\disks\run2b-scratch.img
target_disk_size_gb = 2
