; Run 2b (Intel i5-13420H) -- default build. #525's VMX leg: pin the reboot to
; the non-BSP vCPU, same shape as SVM's already-proven leg. Only proceed to
; this boot once 2a is known to boot clean -- if 2a hung, this one will too,
; for the same underlying reason (#708).
;
; Same guest image as 2a, on the exFAT data partition (sdd2/EADE-CA36) --
; see hype2a.cfg's own comment for why this uses the explicit [disk.*] form.
; Input-script: \input\run2b.txt (input-scripts/reboot-pin.txt -- the SAME
; file staged for 1a).
[hype]
config_version = 1
log_level = debug

[disk.bootdisk]
type = disk
backing = file
path = \hype\disks\alpine2vcpu.img
source_disk = 115E0735191800123920

[vm.run2b]
vcpus = 2
mem_mb = 1024
boot = disk
firmware = uefi
os_hint = linux
disks = bootdisk
