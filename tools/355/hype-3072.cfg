; #355: a VM with MORE than the 2048 MiB default, which is the case the static PCI0 _CRS window
; got wrong. At 3072 MiB the guest's RAM ends at 0xC0000000, so a window declared from 0x80000000
; overlaps the VM's own RAM.
[hype]
config_version = 1

[vm.big]
label = 355 oversized guest RAM
vcpus = 1
mem_mb = 3072
boot = installer
install_media = \iso\test.iso
firmware = uefi
os_hint = linux
target_disk = file:\hype\disks\scratch.img
