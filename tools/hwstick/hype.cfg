; hype bare-metal hardware-validation stick -- multi-ticket run.
;
; BUDGET. A VM is granted WHOLE physical cores and gets ALL of their threads as vCPUs (#560,
; decisions 40 and 47), with the BSP's core reserved. A VM costs ceil(vcpus / threads_per_core)
; cores, so the VM count is bounded by cores and the vCPU count by threads:
;
;     cores for guests = physical cores - 1        (the BSP keeps console/log duty)
;     max total vCPUs  = cores for guests, times threads_per_core
;
;   AMD laptop       4 cores / 8 threads  ->  3 cores, 6 vCPUs  (this file: 2+2+1 on 3 cores)
;   Intel i5-13420H  8 cores / 12 threads ->  7 cores
;
; THIS FILE NOW FITS THE AMD LAPTOP, which it did not before #560. Under the old pricing a vCPU
; cost a whole core, the budget was 3 vCPUs, and two 2-vCPU guests could not both start -- so #527
; and #525 were Intel-only. They are not any more.
;
; It fits EITHER WAY, which is what makes it safe as the default. If sibling detection fails
; (#378's all-zero EFI_CPU_PHYSICAL_LOCATION table, repaired from CPUID 0x8000001E on AMD), hype
; treats every logical processor as a single-threaded core -- 8 of them, 7 for guests -- and 5
; vCPUs still fits. The log says which case happened: `siblings known` vs `siblings UNPROVEN` on
; the placement line, plus a per-VM `N thread(s)/core` line.
;
; Counting VMs instead of vCPUs is what #559 was, and it silently started two VMs on one core.
;
; ORDER IS LOAD-BEARING. hype dispatches VMs in this order and admission caps from the END,
; naming every VM it drops (#396). So the two Alpine guests come first: they carry the
; highest-value ticket (#527) and need the full run length, while every microtest below finishes
; in seconds. If this host cannot admit all of them, what is lost is the cheapest evidence and
; the log says exactly which.
;
; NOTHING HERE WRITES TO A PHYSICAL DISK. Every target_disk is `file:` on this stick, and there is
; no `physical:` target anywhere. That is deliberate and non-negotiable on this machine: the Intel
; laptop's only internal NVMe is the operator's BitLocker Windows install.

[hype]
config_version = 1
log_level = debug

; ---------------------------------------------------------------------------
; #527 / #526 / #461 -- two 2-vCPU Alpine guests, unchanged in shape from the run that
; #523's fix was measured against, so the numbers are directly comparable.
;   #527 wants: both APs live=1, AP exits in the millions, guest "Brought up 1 node, 2 CPUs",
;               VMCSRELOAD steals=0, entry failures 0, sustained past 8 minutes.
;   #526 wants: the soft-lockup count on BARE METAL, against 2 per 240 s on the nested rig.
;   #461 is watch-only: a host #GP with RIP inside the AP trampoline, if it recurs.
; ---------------------------------------------------------------------------
[vm.vm0]
label = alpine-smp8
vcpus = 2
mem_mb = 1536
boot = installer
install_media = \iso\test.iso
firmware = uefi
os_hint = linux
target_disk = file:\hype\disks\vm0.img

; #525 rides on this SECOND guest: the 0xCF9 reset arm fires from vm1's input script, so with no
; vm1 there is no #525 evidence at all. #560 is what made this VM possible on this host.
[vm.vm1]
label = alpine-load-cf9
vcpus = 2
mem_mb = 1536
boot = installer
install_media = \iso\vm1.iso
firmware = uefi
os_hint = linux
target_disk = file:\hype\disks\vm1.img

; ---------------------------------------------------------------------------
; ONE VM, running the SUITE KERNEL (#554), which runs the microtests in turn.
;
; This is the whole reason the stick fits. A VM is granted whole physical cores with the BSP's
; core reserved, so a host runs at most (physical cores - 1) VMs however much RAM it has. That
; bound is on VMs and is unchanged by #560; what #560 changed is how many vCPUs those VMs may
; have:
;
;   AMD laptop       4 physical cores (8 threads), 12 GB  ->  3 VMs, 6 vCPUs
;   Intel i5-13420H  8 physical cores (12 threads), 8 GB  ->  7 VMs
;
; The first version of this file listed seven VMs and the AMD run dropped four of them, including
; both High-priority reproductions it was built to carry -- RAM was never close (the pool was 7012
; of 10165 MiB usable). Two Alpine guests plus one suite VM is exactly three VMs, so it fits the
; SMALLER host, and a bigger one simply has cores to spare.
;
; ps2 is not in the list: it needs \input\vmN.txt and the two Alpine scripts already occupy vm0 and
; vm1. faulter is not in the list either -- it triple-faults on purpose, which would take the suite
; VM and every member after it down; it stays a standalone artifact where that IS the point (#538).
;
; Watch for, in order: MICRO RUN lines naming each member as it starts (so a member that faults is
; identified), then MICRO SUITE: ran=/passed=/failed=/noverdict=. The SUMMARY LINE'S ABSENCE is how
; a truncated sweep is recognised.
;
; Expected today: pflash FAILS (#556's reproduction) and intdeliver may FAIL on bare metal (#557 --
; a kernel guest that programs the legacy PIT/8259 got no interrupts at all on the AMD run). Every
; other member should PASS.
[vm.suite]
label = micro/suite
vcpus = 1
mem_mb = 512
boot = kernel
kernel = \EFI\hype\micro\suite.bin
cmdline = tests=hello,ram1,cpumsr,fwcfg,pci,pflash,intdeliver,pausespin
os_hint = none
