; hype hardware-validation config -- PHYSICAL-WRITE variant (build a502863+).
;
; This run validates hype's PHYSICAL storage write path on the AMD laptop's two spare disks,
; targeted BY SERIAL so it can only ever touch those disks (an unmatched serial arms nothing --
; the by-serial identity guard is what makes this safe on any other machine, e.g. the Intel box
; whose only NVMe is BitLocker Windows). Destructive writes to these two serials are operator-
; authorized and auto-confirmed; every other drive still needs the interactive `confirm`.
;
;   vm0  phys-write-ahci : Alpine live + a [disk.*] backing=physical on the SATA SSD 2132E5BF4EAE,
;                          presented as virtio-blk. Validates #586 (backing=physical section form),
;                          #295 (vectored AHCI writes -- watch the `vec=` in the BLK WRITE DIAG),
;                          and the physical AHCI write path. dd 48 MiB to /dev/vda.
;   vm1  phys-write-nvme : a direct-boot Linux writing to the spare NVMe 5ME3N005713803V2W.
;                          Validates the physical NVMe write path + #588 (kernel-VM PCI BARs).
;   suite               : the micro test suite -- unchanged regression baseline.
;
; 3 vCPUs = the AMD laptop's whole budget (4 physical cores less the reserved BSP, #564).
[hype]
config_version = 1
log_level = debug

[vm.vm0]
label = phys-write-ahci
vcpus = 1
mem_mb = 1536
boot = installer
install_media = \iso\test.iso
firmware = uefi
os_hint = linux
disks = pd

[disk.pd]
type = disk
backing = physical
id_match = 2132E5BF4EAE
partition = whole
bus = virtio-blk
allow_overwrite = true

[vm.vm1]
label = phys-write-nvme
vcpus = 1
mem_mb = 1024
boot = kernel
kernel = \EFI\hype\micro\vmlinuz-virt
initrd = \EFI\hype\micro\initramfs-virt
cmdline = console=uart8250,io,0x3f8,115200n8 acpi=off nosmp
os_hint = linux
target_disk = physical:5ME3N005713803V2W
allow_overwrite = true

[vm.suite]
label = micro/suite
vcpus = 1
mem_mb = 512
boot = kernel
kernel = \EFI\hype\micro\suite.bin
cmdline = tests=hello,ram1,cpumsr,fwcfg,pci,pflash,intdeliver,pausespin
os_hint = none
