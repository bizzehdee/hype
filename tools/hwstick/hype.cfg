; hype bare-metal hardware-validation stick -- multi-ticket run.
;
; ORDER IS LOAD-BEARING. hype dispatches VMs in this order and admission caps from the END,
; naming every VM it drops (#396). So the two Alpine guests come first: they carry the
; highest-value ticket (#527) and need the full run length, while every microtest below finishes
; in seconds. If this host cannot admit all of them, what is lost is the cheapest evidence and
; the log says exactly which.
;
; NOTHING HERE WRITES TO A PHYSICAL DISK. Every target_disk is `file:` on this stick, and there is
; no `physical:` target anywhere. That is deliberate and non-negotiable on this machine: the Intel
; laptop's only internal NVMe is the operator's BitLocker Windows install.

[hype]
config_version = 1
log_level = debug

; ---------------------------------------------------------------------------
; #527 / #526 / #461 -- two 2-vCPU Alpine guests, unchanged in shape from the run that
; #523's fix was measured against, so the numbers are directly comparable.
;   #527 wants: both APs live=1, AP exits in the millions, guest "Brought up 1 node, 2 CPUs",
;               VMCSRELOAD steals=0, entry failures 0, sustained past 8 minutes.
;   #526 wants: the soft-lockup count on BARE METAL, against 2 per 240 s on the nested rig.
;   #461 is watch-only: a host #GP with RIP inside the AP trampoline, if it recurs.
; ---------------------------------------------------------------------------
[vm.vm0]
label = alpine-smp8
vcpus = 2
mem_mb = 1536
boot = installer
install_media = \iso\test.iso
firmware = uefi
os_hint = linux
target_disk = file:\hype\disks\vm0.img

[vm.vm1]
label = alpine-load-cf9
vcpus = 2
mem_mb = 1536
boot = installer
install_media = \iso\vm1.iso
firmware = uefi
os_hint = linux
target_disk = file:\hype\disks\vm1.img

; ---------------------------------------------------------------------------
; The ported microtests (#534). This is their FIRST run on real hardware, and two of them are
; reproductions of open High-priority bugs -- on bare metal those either confirm the defect or
; narrow it to nested KVM, and both answers are worth having.
;
; SIZED AGAINST A MEASURED POOL, twice, because the first two attempts were wrong.
;
; Attempt 1 (2 GB Alpine, 128 MB microtests) had admission drop FIVE of six microtests on an 8 GiB
; host. The log gave the arithmetic: the pool is 4590 MiB and EVERY VM costs 68 MiB of overhead -- a
; 64 MiB vdisk carve plus a 4 MiB firmware copy -- on top of its guest RAM.
;
; Attempt 2 asked for 64 MB microtests and hype said, correctly and out loud:
;   "guest RAM 128 MiB -- hype.cfg value RAISED to the minimum (requested 64, limits 128..3072)"
; There is a 128 MiB floor (#290). So a microtest costs 196 MiB whatever this file asks for, and
; that run fit with TEN MiB spare -- which is not a margin, it is luck, and the laptop's usable RAM
; will not match this dev box's to within 10 MiB.
;
; So: five microtests here, and hype-micro.cfg carries all ten for a separate two-minute boot.
;   2 x (1536 + 68) + 5 x (128 + 68) = 4188 MiB, leaving 402 MiB (9%) spare.
;
; The floor is written out below rather than left implicit, so nobody has to rediscover that asking
; for less does nothing.
; ---------------------------------------------------------------------------

; #553 (High): does a guest's HLT wait loop make progress past the hlt on real hardware?
; Look for "resumes past HLT=" against the tick count. On QEMU it is ~1154 ticks to 1 resume.
[vm.intdeliver]
label = micro/intdeliver
vcpus = 1
mem_mb = 128
boot = kernel
kernel = \EFI\hype\micro\intdeliver.bin
os_hint = none

; #556 (High): does a CFI read after a pflash command return the synthesized response?
; On QEMU this FAILS -- status reads 0x00 where 0x80 is unconditional.
[vm.pflash]
label = micro/pflash
vcpus = 1
mem_mb = 128
boot = kernel
kernel = \EFI\hype\micro\pflash.bin
os_hint = none

; #552's fix on REAL Intel silicon. It was found and fixed on the nested box, so this is the first
; time "vmx = absent" is asserted from a guest on a machine whose host CPU genuinely has VT-x.
[vm.cpumsr]
label = micro/cpumsr
vcpus = 1
mem_mb = 128
boot = kernel
kernel = \EFI\hype\micro\cpumsr.bin
cmdline = hv=require
os_hint = windows

; A real guest bus walk: ECAM, BAR sizing, self-programmed BAR, and the MSI capability #512's
; delivery path depends on -- none of it previously exercised on hardware.
[vm.pci]
label = micro/pci
vcpus = 1
mem_mb = 128
boot = kernel
kernel = \EFI\hype\micro\pci.bin
os_hint = none

; Every page of this VM's RAM written then verified in two passes, so page ALIASING in the real
; EPT on real silicon would show up -- which no in-binary test could see.
[vm.ram1]
label = micro/ram1
vcpus = 1
mem_mb = 128
boot = kernel
kernel = \EFI\hype\micro\ram1.bin
os_hint = none
