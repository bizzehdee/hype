; hype bare-metal stick -- SECOND BOOT: the microtest sweep alone, one VM, about a minute.
;
; To use: rename this to \hype.cfg (keep a copy of the original) and reboot. Use it when the Alpine
; guests are not the point -- e.g. re-checking #556 or #557 after a fix, where a 12-minute run to
; get one suite result is a waste.
;
; ONE VM, so it fits any host. The suite kernel runs every member in turn (#554); see hype.cfg for
; why one-VM-per-test does not fit a 4-core machine.
;
; ps2 IS included here, because with no Alpine guests its input script lands at \input\vm0.txt.
; faulter is still excluded: it triple-faults deliberately and would end the sweep.
;
; SAFETY: no target_disk of any kind. Nothing here has a disk, so there is nothing for a typo to
; point at your BitLocker install.

[hype]
config_version = 1
log_level = debug

[vm.suite]
label = micro/suite
vcpus = 1
mem_mb = 512
boot = kernel
kernel = \EFI\hype\micro\suite.bin
cmdline = tests=hello,ram1,cpumsr,fwcfg,pci,pflash,intdeliver,pausespin,ps2
os_hint = none
