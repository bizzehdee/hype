; hype bare-metal stick -- SECOND BOOT: the complete microtest sweep, no Alpine guests.
;
; To use: rename this file to \hype.cfg on the stick (keep a copy of the original) and reboot. It
; finishes in about two minutes, against the primary config's twelve.
;
; Why two configs rather than one: a microtest costs 196 MiB of the guest pool whatever mem_mb says
; (a 128 MiB floor -- #290 -- plus a 64 MiB vdisk carve and a 4 MiB firmware copy), and the pool on
; an 8 GiB host measures 4590 MiB. Ten of them plus two 1.5 GB Alpine guests does not fit, and a
; config that over-commits loses its TAIL -- which would be the microtests. Splitting the run keeps
; both halves inside comfortable margins:
;
;   10 x (128 + 68) = 1960 MiB, leaving 2630 MiB spare.
;
; SAFETY: no target_disk of any kind here. Not one of these VMs has a disk, so there is nothing for
; a typo to point at your BitLocker install.

[hype]
config_version = 1
log_level = debug

; ---- the two open High-priority reproductions come first ----

; #553: does a guest's HLT wait loop progress past the hlt on real hardware?
[vm.intdeliver]
label = micro/intdeliver
vcpus = 1
mem_mb = 128
boot = kernel
kernel = \EFI\hype\micro\intdeliver.bin
os_hint = none

; #556: expected to FAIL. If it PASSES on bare metal, the defect is nested-only.
[vm.pflash]
label = micro/pflash
vcpus = 1
mem_mb = 128
boot = kernel
kernel = \EFI\hype\micro\pflash.bin
os_hint = none

; ---- first hardware runs of the rest of the ported suite (#534) ----

[vm.cpumsr]
label = micro/cpumsr
vcpus = 1
mem_mb = 128
boot = kernel
kernel = \EFI\hype\micro\cpumsr.bin
cmdline = hv=require
os_hint = windows

[vm.pci]
label = micro/pci
vcpus = 1
mem_mb = 128
boot = kernel
kernel = \EFI\hype\micro\pci.bin
os_hint = none

[vm.ram1]
label = micro/ram1
vcpus = 1
mem_mb = 128
boot = kernel
kernel = \EFI\hype\micro\ram1.bin
os_hint = none

[vm.pausespin]
label = micro/pausespin
vcpus = 1
mem_mb = 128
boot = kernel
kernel = \EFI\hype\micro\pausespin.bin
os_hint = none

[vm.fwcfg]
label = micro/fwcfg
vcpus = 1
mem_mb = 128
boot = kernel
kernel = \EFI\hype\micro\fwcfg.bin
os_hint = none

[vm.hello]
label = micro/hello
vcpus = 1
mem_mb = 128
boot = kernel
kernel = \EFI\hype\micro\hello.bin
cmdline = console=ttyS0 hw=validation
os_hint = none

; ps2 is LAST because it needs \input\vm8.txt, and an index mismatch would leave it waiting for
; input that never comes -- which looks exactly like a wedge. Its own failure message says so.
[vm.ps2]
label = micro/ps2
vcpus = 1
mem_mb = 128
boot = kernel
kernel = \EFI\hype\micro\ps2.bin
os_hint = none

; faulter is DELIBERATELY last and DELIBERATELY included: it proves #538 on real hardware -- a guest
; that triple-faults must stop its own VM and leave the host and every other VM running. Its
; MICRO FAIL is the expected result, and every verdict above it must still be present.
[vm.faulter]
label = micro/faulter
vcpus = 1
mem_mb = 128
boot = kernel
kernel = \EFI\hype\micro\faulter.bin
os_hint = none
