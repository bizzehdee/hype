; hype hardware-validation config -- #597 FAT32 ON-MEDIUM SELF-TEST.
;
; This run reproduces #596 (a per-VM log whose cluster chain Linux rejected at a 32 KiB boundary)
; on the device that showed it. hype's FAT32 WRITER is host-side, so the test is not a guest: when
; the marker file \F32TEST.RUN is present on this volume (stage.sh --fat32 drops it), hype drives
; its own writer against THIS stick's FAT32 across small, medium and large files and every write
; path, reads each back byte-exact, and logs a verdict to \HYPE.LOG:
;
;     FAT32-STICK SELFTEST: PASS|FAIL -- written=.. refused=.. selfcheck_fail=..
;
; It leaves the files in \F32TEST. After the run, pull the stick and:
;
;     tools/fat32-e2e/validate-stick.sh <mountpoint> <device>
;
; which reads every file back through Linux's own vfat driver byte-exact and runs fsck.vfat -n --
; the independent judgement that catches a chain hype round-trips but Linux does not.
;
; The single VM below exists only so hype boots normally and reaches the self-test hook; it writes
; nothing to any disk. There is NO physical: target anywhere in this config -- it is safe on any
; machine.
[hype]
config_version = 1
log_level = debug

[vm.probe]
label = fat32-probe
vcpus = 1
mem_mb = 512
boot = kernel
kernel = \EFI\hype\micro\hello.bin
cmdline = tests=hello
os_hint = none
