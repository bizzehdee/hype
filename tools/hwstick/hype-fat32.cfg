; hype hardware-validation config -- #596/#597 FAT32 + LOG-WRITER STRESS.
;
; This stick attacks the leaked-cluster class fsck found on a real run (#596) from BOTH sides:
;
;  1. Marker-gated synthetic batteries at boot (before the VMs), against the live volume:
;       \F32TEST.RUN  -- sequential + interleaved write battery (tools/fat32-e2e).
;       \LOGTEST.RUN  -- log-shaped concurrent battery (~4 KiB batches).
;     A leading number in either marker file = how many times to repeat that battery this boot
;     (default 1). More repeats = more alloc/free cycles = better odds of catching an intermittent
;     leak. hype's own self-check cannot see a leaked cluster; the post-run fsck.vfat is the judge.
;
;  2. THREE chatty guests below, run CONCURRENTLY, each doing nothing but emitting serial output.
;     hype's REAL log writer (core/log_sink.c, split_log_setup) grows \HYPE.LOG + one \VMn.LOG per
;     guest at the same time on the shared fs -- the actual code path #596 appeared on, which a
;     single quiet guest never exercises. Uneven line counts give an uneven cadence, as real
;     guests do. There is NO physical: target anywhere -- safe on any machine.
;
; After the run: pull the stick and run `sudo fsck.vfat -nv /dev/sdX1` FIRST (report + cluster
; numbers, no auto-fix), then tools/fat32-e2e/validate-stick.sh. A reported lost/leaked cluster,
; cross-linked chain, or free-count error is the #596 defect; correlate its cluster number with the
; FAT32-STICK/LOGTEST-STICK first_cluster boundaries and the \VMn.LOG the writer was growing.
[hype]
config_version = 1
log_level = debug

[vm.chatter0]
label = logchatter-0
vcpus = 1
mem_mb = 512
boot = kernel
kernel = \EFI\hype\micro\logchatter.bin
cmdline = lines=4000
os_hint = none

[vm.chatter1]
label = logchatter-1
vcpus = 1
mem_mb = 512
boot = kernel
kernel = \EFI\hype\micro\logchatter.bin
cmdline = lines=3000
os_hint = none

[vm.chatter2]
label = logchatter-2
vcpus = 1
mem_mb = 512
boot = kernel
kernel = \EFI\hype\micro\logchatter.bin
cmdline = lines=2000
os_hint = none
