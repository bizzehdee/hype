# #357: exercises what the operator SEES -- a labelled VM, and a VM whose storage is by
# reference rather than an inline target_disk. Before this ticket the label was parsed and
# never displayed, and the by-reference VM printed "target=file:" with an empty path.
[hype]
config_version = 1

[disk.live]
type = cdrom
path = \iso\test.iso

[vm.twodisk]
label = 357 Display Name Check
vcpus = 1
mem_mb = 1024
boot = disk
firmware = uefi
os_hint = linux
net_mode = none
cdroms = live
