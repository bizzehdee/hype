; #505 boot 2: attach the raw mkdisk created on the second disk. hype's m5-8 resolver finds the
; file on ANY registered host disk (#324) and treats it as a raw image (no format key needed).
[hype]
config_version = 1
log_level = debug

[vm.rtest]
vcpus = 1
mem_mb = 1024
boot = installer
install_media = \iso\test.iso
firmware = uefi
os_hint = linux
net_mode = none
target_disk = file:\disks\vm.raw
