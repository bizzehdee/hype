; #780: two USB sticks on TWO controllers. The VM's media is on stick A, the one hype
; registers FIRST -- so if probing stick B on the second controller renames A, media_disk
; resolves to nothing and the guest gets no boot device. That is the bug this rig gates.
[hype]
config_version = 1
log_level = debug

[vm.u]
vcpus = 1
mem_mb = 1024
boot = installer
install_media = \iso\test.iso
media_disk = HYPE780A
firmware = uefi
os_hint = linux
net_mode = none
target_disk = file:\hype\disks\u.img
