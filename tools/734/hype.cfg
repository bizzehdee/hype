; #737: a USB HID behind a hub. The VM exists so hype reaches its guest dispatch
; loop, which is the only place the HID interrupt-IN endpoint is polled.
[hype]
config_version = 1
log_level = debug

[vm.u]
vcpus = 1
mem_mb = 1024
boot = installer
install_media = \iso\test.iso
firmware = uefi
os_hint = linux
net_mode = none
target_disk = file:\hype\disks\u.img
