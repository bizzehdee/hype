; #715 vectored-write leg: the guest's disk is a PHYSICAL NVMe target (QEMU's emulated
; NVMe controller), inline target_disk form -- same shape as #295's own AHCI leg
; (tools/295/hype-phys.cfg), swapped to the NVMe backend this ticket adds a writev path to.
[hype]
config_version = 1

[vm.wtest]
label = 715 phys nvme write workload
vcpus = 1
mem_mb = 1024
boot = installer
install_media = \iso\test.iso
firmware = uefi
os_hint = linux
net_mode = none
target_disk = physical:HYPE715SCRATCH
