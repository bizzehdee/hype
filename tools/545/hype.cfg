; #545: direct-boot a REAL Linux -- alpine-virt's bzImage + initramfs, no guest firmware.
; acpi=off + nosmp is the documented minimal first target (no RSDP is passed yet).
[hype]
config_version = 1

[vm.rk]
label = 545 real kernel
vcpus = 1
mem_mb = 1024
boot = kernel
kernel = \EFI\hype\micro\vmlinuz-virt
initrd = \EFI\hype\micro\initramfs-virt
cmdline = console=uart8250,io,0x3f8,115200n8 acpi=off nosmp
os_hint = linux
net_mode = none
