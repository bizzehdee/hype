; #589: the VM's disk is a FILE on the SECOND AHCI port's FAT32 volume. Before #589 the media
; registry held only the boot disk (ahci.0), so this file was NOT FOUND. Now every inventoried
; port is a media device, so the #324 scan reaches ahci.1 and resolves the file.
[hype]
config_version = 1

[vm.rk]
label = 589 file on 2nd AHCI port
vcpus = 1
mem_mb = 1024
boot = kernel
kernel = \EFI\hype\micro\vmlinuz-virt
initrd = \EFI\hype\micro\initramfs-virt
cmdline = console=uart8250,io,0x3f8,115200n8 acpi=off nosmp
os_hint = linux
net_mode = none
target_disk = file:\disks\vda.img
