; #120 boot 2 (the SECOND host boot, a fresh hype.efi process): boot the ALREADY-INSTALLED disk
; directly. No install_media, no ISO at all -- proves hype loads the disk's OWN bootloader.
[hype]
config_version = 1
log_level = debug

[vm.installed]
vcpus = 1
mem_mb = 1024
boot = disk
firmware = uefi
os_hint = linux
net_mode = none
target_disk = file:\hype\disks\vm0.img
