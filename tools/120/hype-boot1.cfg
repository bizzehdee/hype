; #120 boot 1 (the FIRST host boot): install Alpine, unattended, to a real persistent virtual
; disk. Boot 2 (a completely separate hype.efi process, simulating a host power-cycle) then
; boots that SAME disk directly via boot = disk -- no installer, no ISO.
; vcpus = 1, deliberately: #698's AP-vCPU soft-lockup (a 2-vCPU guest's second core wedges)
; is orthogonal to what this ticket tests and reliably wedges an unattended package install
; that runs for minutes. Single-vCPU sidesteps it entirely.
[hype]
config_version = 1
log_level = debug
; hype's OWN uplink for net_mode = nat (docs/hype-cfg-spec.md §5.1, all-or-nothing) -- matches
; QEMU's -netdev user default subnet (10.0.2.0/24, gateway .2, DNS relay .3) exactly, since
; that's the NIC this rig attaches as hype's host-facing e1000 (run-120.sh's run_qemu). hype's
; own NAT plane is a static config, not DHCP, on both sides: the guest gets whatever
; static IP/gateway ITS OWN network config says (hype proxy-ARPs for any gateway a guest asks
; about, docs §5.6/§6e -- there is no guest-facing DHCP server at all), and NAT rewrites the
; guest's traffic to appear from THIS address on the way out.
uplink_ip = 10.0.2.15
uplink_mask = 255.255.255.0
uplink_gateway = 10.0.2.2

[vm.install]
vcpus = 1
mem_mb = 1024
boot = installer
install_media = \iso\test.iso
firmware = uefi
os_hint = linux
; #120: dosfstools/grub-efi (needed to format the ESP and install an EFI GRUB) are NOT on this
; ISO's local package repo -- only a minimal base-system subset is. setup-disk's own package
; resolution for those fails outright without a real mirror reachable over the network; net_mode
; = none produced "ERROR: unable to select packages" and setup-disk silently never touched the
; disk at all, though setup-alpine's own overall exit code was still 0 (a real Alpine footgun
; for scripted/unattended installs).
net_mode = nat
target_disk = file:\hype\disks\vm0.img
