; #232: boot 1 -- unattended Alpine install to \hype\disks\vm0.img, driven
; entirely by the guest's own bridge apkovl (tools/232/linux/bridge-boot.start)
; handing off to the SEPARATE hype-additions.iso's install-linux.sh. hype
; itself just needs both discs attached; no input-script required -- the
; guest powers itself off when done, same shape as #228's own bare-QEMU rig.
[hype]
config_version = 1
log_level = debug

[disk.addons]
type = cdrom
path = \iso\addons.iso

; target_disk is sugar for one implicit [disk.*] entry and cannot coexist
; with an explicit disks=/cdroms= list (core/cfg.c: "two answers to what
; disk" is a BAD_VALUE, not a precedence question) -- so the target disk
; needs its own explicit entry here too, alongside the explicit cdroms=.
[disk.vm0]
type = disk
backing = file
path = \hype\disks\vm0.img

[vm.install]
vcpus = 1
mem_mb = 1024
boot = installer
install_media = \iso\bridge.iso
firmware = uefi
os_hint = linux
cdroms = addons
disks = vm0
