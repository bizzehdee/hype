; #232 boot 2: the ALREADY-INSTALLED disk, no CDs at all -- proves the
; install-linux.sh-produced system is real and self-contained, same shape as
; #120's own boot=disk validation.
[hype]
config_version = 1
log_level = debug

[vm.installed]
vcpus = 1
mem_mb = 1024
boot = disk
firmware = uefi
os_hint = linux
target_disk = file:\hype\disks\vm0.img
