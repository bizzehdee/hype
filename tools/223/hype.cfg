; NET-6 (#223): two Alpine VMs on ONE fully private switch (uplink = none) -- a shared L2
; segment on a host with no usable network at all, which is exactly what a private inter-VM
; LAN must not need.
[hype]
config_version = 1

[switch.lan]
uplink = none

[nic.a]
switch = lan

[nic.b]
switch = lan

[vm.alpha]
label = 223 switch member A
vcpus = 1
mem_mb = 1024
boot = installer
install_media = \iso\test.iso
firmware = uefi
os_hint = linux
net_mode = none
target_disk = file:\hype\disks\alpha.img
nics = a

[vm.beta]
label = 223 switch member B
vcpus = 1
mem_mb = 1024
boot = installer
install_media = \iso\test.iso
firmware = uefi
os_hint = linux
net_mode = none
target_disk = file:\hype\disks\beta.img
nics = b
