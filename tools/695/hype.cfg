; #436: the Windows bring-up rig. Built into rig/media.img by
; tools/436/make-win-rig.sh and booted by tools/436/run-win.sh.
;
; The install media is a RAW GPT PARTITION, not a file: the Windows 10 22H2 ISO is
; 5.8 GB and a FAT32 file cannot exceed 4 GiB, so it cannot live on the ESP at
; all. hype streams it straight off partition 2 of the same drive it booted
; from (the GLADDER-10 path), which is also closer to the real deployment than
; copying 5.8 GB into a filesystem would be.
;
; The drive is named by SERIAL, never by position: enumeration order depends on
; controller probe order, so a positional value silently selects a different
; drive after any hardware or firmware change. run-win.sh gives QEMU's drive the
; serial HYPE436 to match.

[hype]
config_version = 1
; The Windows validation rig needs the guest's GOP/ramfb view, not the default
; dashboard, so each captured screen is evidence of the guest GUI itself.
dashboard_default_view = vm:vm0

[disk.winsys]
type = disk
backing = file
path = \vm0.img
source_disk = HYPE436
format = raw
; Explicit, not left to os_hint: stock Windows media carries no virtio driver.
; AHCI is Windows 10's inbox SATA path and exercises the target controller
; that OVMF has already enumerated successfully.
bus = ahci-sata

[vm.vm0]
label = Windows 10 22H2
vcpus = 2
; #355 patches the DSDT's 32-bit PCI window to start at THIS VM's RAM top, so mem_mb is not
; pinned to 2048 by the aperture -- an older comment here said it was, and that was already
; stale when it was written. The ceiling is HYPE_FW_1_GUEST_RAM_MAX_MB (3072). 2048 is what
; #436 measured against; raise it deliberately, not by accident, so a run stays comparable.
mem_mb = 2048
boot = installer
; install_media names a file on the ESP. That file deliberately does not exist:
; the media is 5.8 GB and cannot be a FAT32 file at all. hype tries the ESP path
; first, does not find it, and falls back to scanning the drive's raw GPT
; partitions for an ISO -- which is where the media actually is (p2). The key is
; still required because `boot = installer` demands it.
install_media = \iso\win10.iso
disks = winsys,answer
firmware = uefi
os_hint = windows

; #695: a 16 MiB FAT volume carrying nothing but autounattend.xml.
;
; Windows Setup reads \autounattend.xml from the root of any attached volume, and this is the
; way to give it one WITHOUT touching the install media. Repacking the ISO was tried first and
; broke it: xorriso's `-boot_image any replay` rewrote the El Torito UEFI entry with a load size
; of 0, the guest firmware then found nothing to boot, and the run died at "No bootable option
; or device was found". The check that was supposed to catch that only asserted the word "UEFI"
; still appeared in the report, which it did.
;
; Attached SECOND on purpose. The answer file installs to DiskID 0, so the 20 GB target must
; enumerate first; if that ever inverts, Setup tries to install Windows onto a 16 MiB volume and
; fails immediately and loudly, which is the right way for this to break.
[disk.answer]
type = disk
backing = file
path = \answer.img
source_disk = HYPE436
format = raw
bus = ahci-sata
