; #434: Windows 11 x64 Setup reaching its compatibility-gate-passed GUI, Secure Boot + TPM 2.0
; present. Built into rig/media.img by tools/434/make-win11-rig.sh (a #436-pattern rig: p1 ESP,
; p2 raw ISO -- the Win11 media is too large for a FAT32 file -- p3 the target disk) and booted
; by tools/789/run-789.sh (CFG=tools/434/hype.cfg).
;
; Builds directly on #436/#430's own Windows config: same AHCI disk bus and os_hint. The only
; additions are the two Windows 11 hard requirements this ticket covers:
;   firmware = uefi-secboot   -- the vendored, enrolled Secure-Boot-capable guest firmware (#432)
;   tpm = on                  -- hype's own TPM 2.0 CRB device (#433)
; The documented registry bypasses for the compat gate are NOT the acceptance path here -- the
; emulated hardware must satisfy the check on its own.

[hype]
config_version = 1
dashboard_default_view = vm:vm0

[disk.winsys]
type = disk
backing = file
path = \vm0.img
source_disk = HYPE436
format = raw
bus = ahci-sata

[vm.vm0]
label = Windows 11 24H2
vcpus = 2
mem_mb = 4096
boot = installer
install_media = \iso\win11.iso
disks = winsys
firmware = uefi-secboot
tpm = on
os_hint = windows
